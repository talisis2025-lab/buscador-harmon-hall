<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmon Hall - Buscador</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --hh-yellow: #FFEA00;
            --hh-yellow-hover: #e6d300;
            --hh-black: #111111;
            --hh-white: #FFFFFF;
            --hh-red: #cc1e3d;
            --hh-red-hover: #a81730;
            
            /* Ajuste a fondos corporativos más limpios */
            --bg: #f4f6f9; 
            --card-bg: var(--hh-white);
            --text: var(--hh-black);
            --header-text: var(--hh-black);
            --border: #e2e8f0;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --info-box: #f8fafc;
            --alert-bg: #fef2f2;
            --alert-text: #cc1e3d;
            --franchise-bg: #fff5f5;
            --franchise-border: #fecdd3;
        }

        [data-theme="dark"] {
            --bg: #0f1115;
            --card-bg: #1e2128;
            --text: #f1f5f9;
            --header-text: var(--hh-yellow);
            --border: #334155;
            --input-bg: #0f1115;
            --input-border: #475569;
            --info-box: #272b36;
            --alert-bg: #3f141d;
            --alert-text: #fecdd3;
            --franchise-bg: #2d1b20;
            --franchise-border: #6b2a36;
        }

        body { 
            /* Cambio a tipografía Montserrat */
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0;
            padding: 30px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease; 
            overflow-x: hidden;
        }

        /* Fondo dinámico más sutil y elegante */
        .wave-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 35vh; z-index: -1;
            background: var(--hh-yellow);
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            box-shadow: 0 10px 30px rgba(255, 234, 0, 0.15);
            transition: all 0.3s ease;
        }

        [data-theme="dark"] .wave-bg {
            background: #1a1c23;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid var(--hh-yellow);
        }

        .header { 
            width: 100%; 
            max-width: 600px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding-bottom: 20px; 
            margin-bottom: 20px; 
        }
        
        .logo-section { display: flex; align-items: center; gap: 10px; }
        .header-title h1 { 
            margin: 0; 
            font-size: 2.2em; 
            font-weight: 900; 
            color: var(--header-text); 
            letter-spacing: -1px; 
            text-transform: uppercase; 
        }
        
        /* Contraste en el texto del logo según el modo */
        [data-theme="light"] .header-title h1 span { color: var(--hh-black); }
        [data-theme="dark"] .header-title h1 span { color: var(--hh-white); }

        .dark-mode-toggle { 
            display: flex; align-items: center; gap: 8px; font-size: 0.9em; 
            cursor: pointer; color: var(--header-text); font-weight: 700; 
            padding: 8px 16px; border-radius: 50px; background: rgba(255,255,255,0.2);
            backdrop-filter: blur(5px); transition: background 0.2s;
        }
        .dark-mode-toggle:hover { background: rgba(255,255,255,0.4); }
        [data-theme="dark"] .dark-mode-toggle { background: rgba(0,0,0,0.3); }

        .contenedor { width: 100%; max-width: 550px; position: relative; }
        .seccion { 
            margin-bottom: 25px; 
            padding: 30px; 
            border-radius: 24px; 
            background-color: var(--card-bg); 
            box-shadow: 0 12px 35px rgba(0,0,0,0.06); 
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        
        label { display: block; margin-bottom: 12px; font-weight: 700; color: var(--text); font-size: 0.95em; text-transform: uppercase; letter-spacing: 0.5px; }

        .busqueda-wrap { position: relative; }

        input[type="text"] { 
            width: 100%; 
            padding: 18px 25px; 
            border: 2px solid var(--input-border); 
            border-radius: 50px; 
            outline: none; 
            background-color: var(--input-bg); 
            color: var(--text); 
            font-size: 1.05em; 
            font-family: inherit;
            box-sizing: border-box; 
            transition: all 0.2s ease;
        }
        
        /* Efecto focus moderno corporativo */
        input[type="text"]:focus {
            border-color: var(--hh-black);
            box-shadow: 0 0 0 4px rgba(255, 234, 0, 0.4);
        }
        [data-theme="dark"] input[type="text"]:focus {
            border-color: var(--hh-yellow);
            box-shadow: 0 0 0 4px rgba(255, 234, 0, 0.2);
        }
        
        .btn-buscar { 
            width: 100%; padding: 16px 20px; background: var(--text); color: var(--card-bg); 
            border: none; border-radius: 50px; cursor: pointer; font-weight: 700; 
            font-size: 1.05em; text-transform: uppercase; margin-top: 15px; 
            font-family: inherit; letter-spacing: 0.5px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }
        [data-theme="dark"] .btn-buscar { color: var(--hh-black); background: var(--hh-yellow); }

        select.btn-buscar {
            background-color: var(--input-bg);
            color: var(--text);
            border: 2px solid var(--input-border);
            border-radius: 14px;
            text-transform: none;
            padding: 14px;
            margin-bottom: 20px;
            font-weight: 600;
            box-shadow: none;
            cursor: pointer;
        }
        select.btn-buscar:focus { border-color: var(--hh-black); outline: none; }
        [data-theme="dark"] select.btn-buscar:focus { border-color: var(--hh-yellow); }

        #resultado { margin-top: 10px; display: flex; flex-direction: column; gap: 25px; padding-bottom: 40px; }
        
        .result-card { 
            background: var(--card-bg); padding: 30px; border-radius: 24px; 
            box-shadow: 0 12px 35px rgba(0,0,0,0.06); position: relative; 
            border: 1px solid var(--border);
            border-top: 6px solid var(--hh-black); 
            animation: fade-in-card 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        [data-theme="dark"] .result-card { border-top-color: var(--hh-yellow); }
        
        @keyframes fade-in-card { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .instituto-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px; gap: 12px; }
        .instituto-nombre { font-size: 1.5em; font-weight: 900; color: var(--text); line-height: 1.2; letter-spacing: -0.5px; }
        .type-badge { padding: 6px 14px; border-radius: 50px; font-size: 0.75em; font-weight: 700; color: var(--hh-white); text-transform: uppercase; display: inline-block; margin-top: 8px; letter-spacing: 0.5px; }
        .type-badge.own { background: var(--hh-black); }
        .type-badge.franchise { background: var(--hh-red); }
        
        .caja-info { margin-top: 15px; padding: 20px; border-radius: 16px; background-color: var(--info-box); border: 1px solid var(--border); }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 12px; }
        .info-item { display: flex; flex-direction: column; gap: 4px; }
        .info-label { color: #64748b; font-weight: 700; font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-value { font-weight: 700; color: var(--text); font-size: 1.1em; word-break: break-word; }
        
        .caja-info.franchise { background-color: var(--franchise-bg); border: 1px solid var(--franchise-border); border-left: 5px solid var(--hh-red); }
        
        .caja-alerta { margin-top: 15px; padding: 15px; background-color: var(--alert-bg); color: var(--alert-text); border-radius: 14px; font-weight: 600; display: flex; align-items: center; gap: 10px; font-size: 0.9em; border: 1px solid var(--franchise-border); }

        .btn-wiki { 
            display: block; margin-top: 20px; padding: 16px; background-color: var(--hh-yellow); 
            color: var(--hh-black); text-decoration: none; border-radius: 16px; font-weight: 800; 
            text-align: center; text-transform: uppercase; letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .btn-copiar {
            display: block; width: 100%; margin-top: 15px; padding: 16px; 
            background-color: var(--hh-red); color: var(--hh-white); border: none; 
            border-radius: 16px; font-weight: 800; text-align: center; 
            text-transform: uppercase; cursor: pointer; font-family: inherit;
            letter-spacing: 0.5px; transition: all 0.2s ease;
        }

        /* Efectos Hover modernos */
        .btn-buscar:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .btn-copiar:hover { background-color: var(--hh-red-hover); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(204, 30, 61, 0.2); }
        .btn-wiki:hover { background-color: var(--hh-yellow-hover); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 234, 0, 0.3); }

        #loadingSpinner { display: none; position: absolute; top: 30px; right: 30px; color: var(--hh-black); font-size: 1.2em; animation: spin 1s linear infinite; }
        [data-theme="dark"] #loadingSpinner { color: var(--hh-yellow); }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .sugerencias {
            display: none; position: absolute; top: calc(100% + 10px); left: 0; right: 0; z-index: 50;
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow: hidden; max-height: 280px; overflow-y: auto;
        }

        .sugerencia-item { padding: 14px 20px; cursor: pointer; border-bottom: 1px solid var(--border); font-weight: 600; color: var(--text); transition: background-color 0.2s ease; }
        .sugerencia-item:hover { background: var(--info-box); padding-left: 25px; } /* Pequeño efecto visual al hacer hover */
        .sugerencia-item:last-child { border-bottom: none; }
        .sugerencia-sub { display: block; margin-top: 6px; font-size: 0.8em; font-weight: 500; color: #64748b; }

        .toast-container { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 9999; }

        .toast {
            background: var(--hh-black); color: var(--hh-yellow); padding: 14px 28px; 
            border-radius: 50px; font-weight: 800; text-transform: uppercase; font-size: 0.85em; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 12px; 
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1), fadeOut 0.3s ease-in 2.2s forwards;
            letter-spacing: 0.5px;
        }

        [data-theme="dark"] .toast { background: var(--hh-yellow); color: var(--hh-black); }

        @keyframes slideUp { from { transform: translate(-50%, 100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
    </style>
</head>
<body data-theme="light">

<div class="wave-bg"></div>

<div class="header">
    <div class="logo-section">
        <div class="header-title"><h1>Harmon <span>Hall</span></h1></div>
    </div>
    <div class="dark-mode-toggle" onclick="toggleDarkMode()">
        <i id="darkModeIcon" class="fas fa-moon"></i> <span>Noche</span>
    </div>
</div>

<div class="contenedor">
    <div class="seccion" style="text-align: center; padding: 20px;">
        <i id="loadingSpinner" class="fas fa-spinner"></i>
        <span id="statusCarga" style="font-weight: 600;">Conectando base de datos... ⏳</span>
    </div>

    <div class="seccion">
        <label>Buscador de Institutos</label>
        <div class="busqueda-wrap">
            <input type="text" id="textoBusqueda" placeholder="Ej: Santa Catarina..." onfocus="this.select()">
            <div id="sugerencias" class="sugerencias"></div>
        </div>
        <button class="btn-buscar" onclick="buscarInstituto()">Buscar Ahora</button>
    </div>

    <div id="resultado"></div>
</div>

<script>
    let todosLosDatos = [];
    const archivosA_Cargar = ['database.xlsx', 'database2.xlsx']; 

    function normalizarTexto(texto) {
        return (texto ?? "")
            .toString()
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .trim();
    }

    function formatearMoneda(valor) {
        const numero = Number(valor) || 0;
        return "$" + numero.toLocaleString("es-MX", { maximumFractionDigits: 0 });
    }

    function obtenerCotizacion(datos, programa) {
        const ins = parseFloat(datos.Inscripcion) || 0;
        let html = "";
        let texto = "";
        let tienePrecio = false;

        if (['adults', 'pro', 'kids', 'pteen'].includes(programa)) {
            let mensu = 0, sab = 0, lib = 0, titulo = "";

            if (programa === 'adults') {
                mensu = parseFloat(datos.Adults_FF) || 0;
                sab = parseFloat(datos.Adults_SAB) || 0;
                lib = parseFloat(datos.Libros_Adults) || 0;
                titulo = "Adultos (1-20)";
            } else if (programa === 'pro') {
                mensu = parseFloat(datos.Adults_PRO_FF) || 0;
                lib = parseFloat(datos.Libros_Adults) || 0;
                titulo = "Adultos Pro (21-24)";
            } else if (programa === 'kids') {
                mensu = parseFloat(datos.KPT_SEM) || 0;
                sab = parseFloat(datos.KPT_SAB) || 0;
                lib = parseFloat(datos.Libros_KIDS) || 0;
                titulo = "Kids";
            } else if (programa === 'pteen') {
                mensu = parseFloat(datos.KPT_SEM) || 0;
                sab = parseFloat(datos.KPT_SAB) || 0;
                lib = parseFloat(datos.Libros_PTEEN) || 0;
                titulo = "Pre-Teens";
            }
            
            if (mensu > 0 || sab > 0) tienePrecio = true;

            if (tienePrecio) {
                html = `<div class="caja-info">
                    <span class="info-label" style="display:block; margin-bottom:10px;"><i class="fas fa-tags" style="color:var(--text);"></i> ${titulo} | Zona ${datos.Zona || 'A'}</span>
                    <div class="info-grid">
                        ${ins > 0 ? `<div class="info-item"><span class="info-label">Inscripción</span><span class="info-value">${formatearMoneda(ins)}</span></div>` : ''}
                        ${lib > 0 ? `<div class="info-item"><span class="info-label">Libro</span><span class="info-value">${formatearMoneda(lib)}</span></div>` : ''}
                        ${mensu > 0 ? `<div class="info-item" style="background:rgba(0,0,0,0.03); padding:12px; border-radius:12px;"><span class="info-label">Mensualidad FF/SEM</span><span class="info-value">${formatearMoneda(mensu)}</span></div>` : ''}
                        ${sab > 0 ? `<div class="info-item" style="background:rgba(0,0,0,0.03); padding:12px; border-radius:12px;"><span class="info-label">Mensualidad Sabatina</span><span class="info-value">${formatearMoneda(sab)}</span></div>` : ''}
                    </div>
                </div>`;

                texto = [
                    `Programa: ${titulo}`,
                    `Zona: ${datos.Zona || 'A'}`,
                    ins > 0 ? `Inscripción: ${formatearMoneda(ins)}` : null,
                    lib > 0 ? `Libro: ${formatearMoneda(lib)}` : null,
                    mensu > 0 ? `Mensualidad FF/SEM: ${formatearMoneda(mensu)}` : null,
                    sab > 0 ? `Mensualidad Sabatina: ${formatearMoneda(sab)}` : null
                ].filter(Boolean).join("\n");
            }
        } else {
            let total = 0, titulo = "";

            if (programa === 'toefl') {
                total = parseFloat(datos.TOEFL_ITP_PRE) || 0;
                titulo = "PAGO ÚNICO TOEFL ITP";
            } else if (programa === 'tkt') {
                total = parseFloat(datos.TKT) || 0;
                titulo = "PAGO ÚNICO TKT";
            } else if (programa === 'icc') {
                total = parseFloat(datos.ICC_FF) || 0;
                titulo = "PAGO ÚNICO ICC";
            }

            if (total > 0) tienePrecio = true;

            if (tienePrecio) {
                html = `<div class="caja-info" style="border-left: 5px solid var(--hh-yellow); text-align:center;">
                    <span class="info-label">${titulo}</span>
                    <div style="font-size: 2.2em; font-weight: 900; margin: 15px 0; color: var(--text);">${formatearMoneda(total)}</div>
                    <span class="info-label" style="font-size:0.75em;"><i class="fas fa-check-circle"></i> Todo incluido</span>
                </div>`;

                texto = [
                    `Programa: ${titulo}`,
                    `Total: ${formatearMoneda(total)}`,
                    `Todo incluido`
                ].join("\n");
            }
        }

        if (!tienePrecio) {
            html = `
                <div class="caja-alerta">
                    <i class="fas fa-exclamation-triangle"></i> Precios no definidos, valida la información.
                </div>
            `;
            texto = "Precios no definidos, valida la información.";
        }

        return { html, texto, tienePrecio };
    }

    function mostrarNotificacion(mensaje) {
        let container = document.querySelector('.toast-container');
        if (!container) {
            container = document.createElement('div');
            container.className = 'toast-container';
            document.body.appendChild(container);
        }

        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<i class="fas fa-check-circle"></i> ${mensaje}`;
        
        container.appendChild(toast);

        setTimeout(() => {
            toast.remove();
        }, 2500);
    }

    async function copiarAlPortapapeles(texto) {
        try {
            await navigator.clipboard.writeText(texto);
            mostrarNotificacion("Resumen copiado con éxito");
        } catch (error) {
            const area = document.createElement("textarea");
            area.value = texto;
            document.body.appendChild(area);
            area.select();
            document.execCommand("copy");
            document.body.removeChild(area);
            mostrarNotificacion("Resumen copiado con éxito");
        }
    }

    function toggleDarkMode() {
        const body = document.body;
        const isLight = body.getAttribute('data-theme') === 'light';
        body.setAttribute('data-theme', isLight ? 'dark' : 'light');
        document.getElementById('darkModeIcon').className = isLight ? 'fas fa-sun' : 'fas fa-moon';
        document.querySelector('.dark-mode-toggle span').innerText = isLight ? 'Día' : 'Noche';
    }

    function actualizarCotizacion(index) {
        const selector = document.getElementById(`select-${index}`);
        const programa = selector.value;
        const datos = JSON.parse(decodeURIComponent(selector.getAttribute('data-info')));
        const contenedor = document.getElementById(`precios-${index}`);

        const cotizacion = obtenerCotizacion(datos, programa);
        contenedor.innerHTML = cotizacion.html;
    }

    function copiarResumen(index) {
        const selector = document.getElementById(`select-${index}`);
        const programa = selector.value;
        const datos = JSON.parse(decodeURIComponent(selector.getAttribute('data-info')));

        const tipo = (datos.Tipo || "").toLowerCase();
        const classType = tipo.includes("franquicia") ? "franquicia" : "propio";
        const cotizacion = obtenerCotizacion(datos, programa);

        let textoBase = [
            `Instituto: ${datos.Nombre || 'N/D'}`,
            `Tipo: ${datos.Tipo || 'Instituto'}`,
            `Categoría: ${classType === "franquicia" ? "Franquicia" : "Propio"}`,
            cotizacion.texto
        ].filter(Boolean).join("\n");

        if (classType === "franquicia") {
            textoBase += `\n\nContacto Franquicia:\nCoordinador: ${datos.NOMBRE2 || "N/D"}\nTeléfono: ${datos.TELÉFONOS || "N/D"}\nEmail: ${datos.EMAIL3 || "N/D"}`;
        }

        copiarAlPortapapeles(textoBase);
    }

    function renderSugerencias(lista) {
        const contenedor = document.getElementById("sugerencias");

        if (!lista.length) {
            contenedor.innerHTML = "";
            contenedor.style.display = "none";
            return;
        }

        contenedor.innerHTML = lista.map(item => `
            <div class="sugerencia-item" data-nombre="${String(item.Nombre || "").replace(/"/g, '&quot;')}">
                ${item.Nombre || "Sin nombre"}
                <span class="sugerencia-sub">${item.Tipo || "Instituto"}${item.Zona ? " • Zona " + item.Zona : ""}</span>
            </div>
        `).join("");

        contenedor.style.display = "block";
    }

    function actualizarSugerencias() {
        const busqueda = normalizarTexto(document.getElementById('textoBusqueda').value);
        const contenedor = document.getElementById("sugerencias");

        if (!busqueda) {
            contenedor.innerHTML = "";
            contenedor.style.display = "none";
            return;
        }

        const sugerencias = todosLosDatos
            .filter(f => f.Nombre && normalizarTexto(f.Nombre).includes(busqueda))
            .sort((a, b) => {
                const na = normalizarTexto(a.Nombre);
                const nb = normalizarTexto(b.Nombre);
                const aEmpieza = na.startsWith(busqueda) ? 0 : 1;
                const bEmpieza = nb.startsWith(busqueda) ? 0 : 1;
                if (aEmpieza !== bEmpieza) return aEmpieza - bEmpieza;
                return na.localeCompare(nb);
            })
            .slice(0, 6);

        renderSugerencias(sugerencias);
    }

    function seleccionarSugerencia(nombre) {
        document.getElementById('textoBusqueda').value = nombre;
        document.getElementById("sugerencias").style.display = "none";
        buscarInstituto();
    }

    function buscarInstituto() {
        const busqueda = normalizarTexto(document.getElementById('textoBusqueda').value.trim());
        document.getElementById("sugerencias").style.display = "none";

        const resultados = todosLosDatos.filter(f => 
            f.Nombre && normalizarTexto(f.Nombre).includes(busqueda)
        );

        let htmlTotal = "";

        resultados.forEach((encontrado, index) => {
            const infoJson = encodeURIComponent(JSON.stringify(encontrado));
            const tipo = (encontrado.Tipo || "").toLowerCase();
            const classType = tipo.includes("franquicia") ? "franchise" : "own";
            
            let franquiciaHtml = "";
            if (classType === "franchise") {
                franquiciaHtml = `
                    <div class="caja-info franchise" style="margin-bottom: 20px; margin-top: 15px;">
                        <span class="info-label" style="margin-bottom: 12px; display:block; color: var(--hh-red);"><i class="fas fa-headset"></i> Contacto Franquicia</span>
                        <div class="info-grid">
                            <div class="info-item"><span class="info-label">Coordinador</span><span class="info-value">${encontrado.NOMBRE2 || "N/D"}</span></div>
                            <div class="info-item"><span class="info-label">Teléfono</span><span class="info-value">${encontrado.TELÉFONOS || "N/D"}</span></div>
                            <div class="info-item" style="grid-column: span 2;"><span class="info-label">Email</span><span class="info-value" style="word-break: break-all; font-size: 0.95em;">${encontrado.EMAIL3 || "N/D"}</span></div>
                        </div>
                    </div>
                `;
            }

            let enlaceHtml = "";
            let linkUrl = (encontrado.Wiki || "").toString().trim();
            let tieneWiki = linkUrl !== "" && linkUrl !== "#" && linkUrl.toLowerCase() !== "n/a" && linkUrl.toLowerCase() !== "0";

            if (classType === "franchise") {
                enlaceHtml = "";
            } else {
                if (tieneWiki) {
                    if (!linkUrl.startsWith('http')) linkUrl = 'https://' + linkUrl;
                    enlaceHtml = `<a href="${linkUrl}" target="_blank" class="btn-wiki"><i class="fas fa-external-link-alt"></i> Abrir WIKI</a>`;
                } else {
                    enlaceHtml = `<div style="text-align:center; margin-top:20px; padding:15px; background-color:var(--info-box); border-radius:14px; font-weight:600; color:#64748b; font-size:0.9em;">
                        <i class="fas fa-info-circle"></i> Sin wiki disponible
                    </div>`;
                }
            }

            htmlTotal += `
                <div class="result-card">
                    <div class="instituto-header">
                        <div>
                            <span class="instituto-nombre">${encontrado.Nombre}</span><br>
                            <span class="type-badge ${classType}">${encontrado.Tipo || 'Instituto'}</span>
                        </div>
                        <i class="fas fa-school" style="font-size: 1.8em; color: var(--border);"></i>
                    </div>

                    ${franquiciaHtml}

                    <label style="font-size:0.8em; color: #64748b; margin-top: 10px;">Selecciona Programa:</label>
                    <select id="select-${index}" class="btn-buscar" data-info="${infoJson}" onchange="actualizarCotizacion(${index})">
                        <option value="adults">Adultos (1-20)</option>
                        <option value="pro">Adultos Pro (21-24)</option>
                        <option value="kids">Kids</option>
                        <option value="pteen">Pre-Teens</option>
                        <option value="toefl">TOEFL ITP</option>
                        <option value="tkt">TKT</option>
                        <option value="icc">ICC</option>
                    </select>

                    <div id="precios-${index}"></div>

                    <button class="btn-copiar" onclick="copiarResumen(${index})">
                        <i class="fas fa-copy"></i> Copiar resumen
                    </button>

                    ${enlaceHtml}
                </div>`;
        });

        if (resultados.length > 0) {
            document.getElementById('resultado').innerHTML = htmlTotal;
            resultados.forEach((_, i) => actualizarCotizacion(i));
        } else {
            document.getElementById('resultado').innerHTML = `<div class="caja-alerta" style="justify-content:center; padding: 20px;"><i class="fas fa-search"></i> No se encontró nada para "${document.getElementById('textoBusqueda').value.trim()}".</div>`;
        }
    }

    window.onload = async function() {
        document.getElementById('loadingSpinner').style.display = 'block';

        for (const archivo of archivosA_Cargar) {
            try {
                const response = await fetch(archivo);
                const arrayBuffer = await response.arrayBuffer();
                const libro = XLSX.read(new Uint8Array(arrayBuffer), {type: 'array'});
                const json = XLSX.utils.sheet_to_json(libro.Sheets[libro.SheetNames[0]]);
                todosLosDatos = todosLosDatos.concat(json);
            } catch (e) {
                console.error("Error cargando: " + archivo, e);
                document.getElementById('statusCarga').innerHTML = "❌ Error al cargar algunos datos.";
            }
        }

        document.getElementById('loadingSpinner').style.display = 'none';
        
        if(!document.getElementById('statusCarga').innerHTML.includes("Error")) {
            document.getElementById('statusCarga').innerHTML = "✅ Base de datos lista.";
            setTimeout(() => {
                document.getElementById('statusCarga').parentElement.style.display = 'none';
            }, 2000);
        }
    };

    document.getElementById('textoBusqueda').addEventListener('input', actualizarSugerencias);

    document.getElementById('textoBusqueda').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            buscarInstituto();
        } else if (e.key === 'Escape') {
            document.getElementById("sugerencias").style.display = "none";
        }
    });

    document.getElementById("sugerencias").addEventListener("click", function(e) {
        const item = e.target.closest(".sugerencia-item");
        if (!item) return;
        seleccionarSugerencia(item.getAttribute("data-nombre"));
    });

    document.addEventListener("click", function(e) {
        const wrap = document.querySelector(".busqueda-wrap");
        const sugerencias = document.getElementById("sugerencias");
        if (!wrap.contains(e.target)) {
            sugerencias.style.display = "none";
        }
    });
</script>
</body>
</html>
