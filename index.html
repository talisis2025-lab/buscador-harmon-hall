<body data-theme="light">
<div class="wave-bg"></div>
<div class="header">
    <div class="logo-section">
        <div class="header-title"><h1 id="logoHH">Harmon <span>Hall</span></h1></div>
    </div>
    <div class="dark-mode-toggle" onclick="toggleDarkMode()">
        <i id="darkModeIcon" class="fas fa-moon"></i>
        <span>Noche</span>
    </div>
</div>
<div class="contenedor">
    <div class="seccion" style="text-align: center; padding: 18px 24px; position:relative;">
        <i id="loadingSpinner" class="fas fa-spinner"></i>
        <span id="statusCarga">Conectando base de datos… ⏳</span>
    </div>
    
    <div class="seccion" style="position: relative; z-index: 100;">
        <label>Buscador de Institutos</label>
        <div class="busqueda-wrap">
            <input type="text" id="textoBusqueda" placeholder="Ej: Santa Catari..." autocomplete="off" onfocus="this.select()">
            <button id="btnLimpiar" class="btn-limpiar" onclick="limpiarBusqueda()" aria-label="Limpiar búsqueda">
                <i class="fas fa-times"></i>
            </button>
            <div id="sugerencias" class="sugerencias"></div>
        </div>
        <button class="btn-buscar" onclick="buscarInstituto()">Buscar Ahora</button>
    </div>
    <div id="resultado"></div>
</div>

<div class="help-widget" id="helpWidget" aria-live="polite">
    <div class="help-panel" id="helpPanel" role="dialog" aria-label="Ayuda y contacto">
        <button class="help-close" type="button" onclick="toggleHelp(false)" aria-label="Cerrar ayuda">
            <i class="fas fa-times"></i>
        </button>
        <div class="help-title">
            <i class="fas fa-circle-question"></i>
            <span>Dudas o sugerencias</span>
        </div>
        <p class="help-text">
            Si detectas algo que se pueda mejorar o tienes alguna duda, contáctame por Teams.
        </p>
        <div class="help-email">
            <i class="fab fa-microsoft"></i> abraham.quintero@unid.mx 
        </div>
    </div>
    <button class="help-btn" type="button" onclick="toggleHelp()" aria-label="Abrir ayuda">
        ?
    </button>
