<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mantenimiento - Harmon Hall</title>
    <style>
        body { 
            background-color: #FFEA00; /* Amarillo HH */
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h1 { color: #000; margin-bottom: 10px; text-transform: uppercase; }
        p { color: #555; font-weight: bold; }
        .icon { font-size: 50px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⚙️</div>
        <h1>Actualizando</h1>
        <p>Estamos mejorando el buscador para darte mejores herramientas de venta. <br><br>Volvemos en unos minutos.</p>
    </div>
</body>
</html>
