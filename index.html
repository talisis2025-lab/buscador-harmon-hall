<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmon Hall - Buscador Pro</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --hh-yellow: #FFEA00;
            --hh-black: #000000;
            --hh-white: #FFFFFF;
            --hh-gray: #f4f4f4;
            --hh-red: #cc1e3d;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--hh-yellow);
            color: var(--hh-black);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .wave-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, #fff176 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, #fff176 0%, transparent 40%);
        }

        .navbar {
            width: 100%;
            background: var(--hh-black);
            padding: 15px 0;
            display: flex;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .navbar-content {
            width: 90%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-text {
            color: var(--hh-white);
            font-size: 1.5em;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .logo-text span { color: var(--hh-yellow); }

        .main-container {
            width: 90%;
            max-width: 550px;
            margin-top: 40px;
            text-align: center;
        }

        .hero-text {
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease-out;
        }

        .hero-text h1 {
            font-size: 2.2em;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            line-height: 1;
        }

        .hero-text p {
            background: var(--hh-black);
            color: var(--hh-yellow);
            display: inline-block;
            padding: 5px 15px;
            font-weight: bold;
            border-radius: 50px;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .search-box {
            background: var(--hh-white);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 25px;
            border: 2px solid #eee;
            border-radius: 50px;
            font-size: 1.1em;
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box;
            background: #f9f9f9;
        }

        input[type="text"]:focus {
            border-color: var(--hh-black);
            background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .btn-search {
            width: 100%;
            background: var(--hh-black);
            color: var(--hh-yellow);
            border: none;
            padding: 18px;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-search:hover {
            transform: scale(1.02);
            background: #222;
        }

        .status-bar {
            margin-top: 15px;
            font-size: 0.85em;
            font-weight: bold;
            color: #666;
        }

        #resultado {
            margin-top: 30px;
            width: 100%;
            padding-bottom: 80px;
        }

        .card {
            background: var(--hh-white);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-left: 8px solid var(--hh-black);
            text-align: left;
            animation: fadeInUp 0.5s ease-out forwards;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.4em;
            font-weight: 900;
            margin: 0;
            color: var(--hh-black);
        }

        .badge-type {
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.75em;
            font-weight: 900;
            text-transform: uppercase;
            color: white;
        }

        .info-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .info-box {
            background: var(--hh-gray);
            padding: 12px;
            border-radius: 12px;
        }

        .info-label {
            font-size: 0.7em;
            color: #888;
            font-weight: bold;
            text-transform: uppercase;
            display: block;
        }

        .info-value {
            font-size: 1em;
            font-weight: bold;
            color: var(--hh-black);
        }

        .btn-wiki {
            display: block;
            text-align: center;
            background: var(--hh-yellow);
            color: var(--hh-black);
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            margin-top: 20px;
            font-weight: 900;
            font-size: 0.9em;
            border: 2px solid var(--hh-black);
            transition: all 0.3s;
        }

        .btn-wiki:hover {
            background: var(--hh-black);
            color: var(--hh-yellow);
        }

        .footer-nabil {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--hh-black);
            color: var(--hh-white);
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.75em;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="wave-bg"></div>

<div class="navbar">
    <div class="navbar-content">
        <div class="logo-text">HARMON <span>HALL</span></div>
        <div style="color: white; font-size: 0.8em; font-weight: bold;">Contac Center</div>
    </div>
</div>

<div class="main-container">
    <div class="hero-text">
        <p>Buscador de Institutos</p>
    </div>

    <div class="search-box">
        <div class="input-group">
            <input type="text" id="inputBusqueda" placeholder="Ej: San Luis Potosí...">
        </div>
        <button class="btn-search" onclick="ejecutarBusqueda()">
            <i class="fas fa-search"></i> Buscar Ahora
        </button>
        <div id="status" class="status-bar">Conectando con la base de datos...</div>
    </div>

    <div id="resultado"></div>
</div>

<div class="footer-nabil">By Nab</div>

<script>
    let baseDatos = [];
    const archivos = ['database.xlsx', 'database2.xlsx'];

    window.onload = async function() {
        let cargados = 0;
        for (const file of archivos) {
            try {
                const res = await fetch(file);
                const arrayBuffer = await res.arrayBuffer();
                const data = new Uint8Array(arrayBuffer);
                const workbook = XLSX.read(data, {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet);
                baseDatos = baseDatos.concat(json);
                cargados++;
            } catch (e) { console.error("Error cargando: " + file); }
        }
        
        const status = document.getElementById('status');
        if(cargados > 0) {
            status.innerHTML = `✅ ${baseDatos.length} institutos listos para búsqueda.`;
            status.style.color = "black";
        } else {
            status.innerHTML = "❌ No se encontraron archivos Excel.";
            status.style.color = "red";
        }
    };

    function ejecutarBusqueda() {
        const query = document.getElementById('inputBusqueda').value.toLowerCase().trim();
        const contenedor = document.getElementById('resultado');
        
        if (!query) return;

        const filtrados = baseDatos.filter(f => 
            f.Nombre && f.Nombre.toString().toLowerCase().includes(query)
        );

        if (filtrados.length > 0) {
            contenedor.innerHTML = filtrados.map((item, i) => {
                const tipo = (item.Tipo || "Propia").toString();
                const colorBadge = tipo.toLowerCase().includes("franquicia") ? "#cc1e3d" : "#000";
                
                return `
                    <div class="card" style="animation-delay: ${i * 0.1}s">
                        <div class="card-header">
                            <h2 class="card-title">${item.Nombre}</h2>
                            <span class="badge-type" style="background: ${colorBadge}">${tipo}</span>
                        </div>
                        
                        <div class="info-row">
                            <div class="info-box">
                                <span class="info-label">Zona</span>
                                <span class="info-value">${item.Zona || 'N/A'}</span>
                            </div>
                            <div class="info-box">
                                <span class="info-label">Inscripción</span>
                                <span class="info-value">$${item.Inscripcion || '0'}</span>
                            </div>
                            <div class="info-box">
                                <span class="info-label">Precio FF</span>
                                <span class="info-value">$${item.Precio_FF || '0'}</span>
                            </div>
                            <div class="info-box">
                                <span class="info-label">Precio Sabatina</span>
                                <span class="info-value">$${item.Precio_SA || '0'}</span>
                            </div>
                        </div>

                        ${item.Wiki ? `
                            <a href="${item.Wiki}" target="_blank" class="btn-wiki">
                                <i class="fas fa-link"></i> VER DETALLES EN WIKI
                            </a>
                        ` : ''}
                    </div>
                `;
            }).join('');
        } else {
            contenedor.innerHTML = '<div class="card" style="text-align:center">No se encontró ningún instituto con ese nombre.</div>';
        }
    }

    document.getElementById('inputBusqueda').addEventListener('keypress', (e) => {
        if(e.key === 'Enter') ejecutarBusqueda();
    });
</script>

</body>
</html>
