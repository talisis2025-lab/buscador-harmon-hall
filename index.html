<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmon Hall - Buscador Sales Support</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --hh-yellow: #FFEA00;
            --hh-black: #000000;
            --hh-white: #FFFFFF;
            --hh-red: #cc1e3d;
            --hh-blue-maps: #4285F4; /* Color oficial de Google Maps */
            
            --bg: var(--hh-yellow);
            --card-bg: var(--hh-white);
            --text: var(--hh-black);
            --border: #e8eaed;
            --input-bg: #f9f9f9;
            --input-border: #eee;
            --info-box: #f4f4f4;
            --alert-bg: #ffebee;
            --alert-text: #cc1e3d;
            --franchise-bg: #fff8f8;
            --franchise-border: #ffcdd2;
        }

        [data-theme="dark"] {
            --bg: #111111;
            --card-bg: #222222;
            --text: #ffffff;
            --border: #333333;
            --input-bg: #333333;
            --input-border: #444444;
            --info-box: #2a2a2a;
            --alert-bg: #4a151b;
            --alert-text: #ff8a9f;
            --franchise-bg: #301b1e;
            --franchise-border: #5c262e;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; transition: background-color 0.3s; 
        }

        .header { width: 100%; max-width: 600px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--text); padding-bottom: 15px; margin-bottom: 30px; }
        .header-title h1 { margin: 0; font-size: 1.8em; font-weight: 900; text-transform: uppercase; }
        .header-title span { color: inherit; opacity: 0.7; }

        .contenedor { width: 100%; max-width: 550px; position: relative; }
        .seccion { margin-bottom: 20px; padding: 25px; border-radius: 20px; background-color: var(--card-bg); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        input[type="text"] { width: 100%; padding: 18px 25px; border: 2px solid var(--input-border); border-radius: 50px; outline: none; box-sizing: border-box; background-color: var(--input-bg); color: var(--text); font-size: 1.05em; }
        
        .btn-buscar { width: 100%; padding: 16px 20px; background: var(--text); color: var(--bg); border: none; border-radius: 50px; cursor: pointer; font-weight: 900; font-size: 1.1em; text-transform: uppercase; margin-top: 10px; }

        .result-card { background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); position: relative; animation: fade-in-card 0.5s ease-out forwards; border-left: 8px solid var(--text); margin-bottom: 20px; }
        
        .instituto-nombre { font-size: 1.4em; font-weight: 900; display: block; margin-bottom: 5px; }
        
        .type-badge { padding: 5px 12px; border-radius: 50px; font-size: 0.75em; font-weight: 900; color: white; text-transform: uppercase; }
        .type-badge.own { background: var(--hh-black); }
        .type-badge.franchise { background: var(--hh-red); }

        .caja-info { margin-top: 15px; padding: 15px; border-radius: 12px; background-color: var(--info-box); }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 10px; }
        .info-label { color: #888; font-weight: bold; font-size: 0.8em; text-transform: uppercase; }
        .info-value { font-weight: 900; color: var(--text); }

        /* Estilos de Botones de Acción */
        .botones-accion { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        
        .btn-wiki, .btn-maps { 
            padding: 12px; text-decoration: none; border-radius: 12px; font-weight: 900; 
            text-align: center; font-size: 0.85em; text-transform: uppercase; display: flex; 
            align-items: center; justify-content: center; gap: 8px; transition: 0.2s;
        }

        .btn-wiki { background-color: var(--hh-yellow); color: var(--hh-black); border: 2px solid var(--hh-black); }
        .btn-maps { background-color: var(--hh-white); color: var(--hh-blue-maps); border: 2px solid var(--hh-blue-maps); }
        
        .btn-wiki:hover { background-color: var(--hh-black); color: var(--hh-yellow); }
        .btn-maps:hover { background-color: var(--hh-blue-maps); color: var(--hh-white); }

        @keyframes fade-in-card { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="header">
    <div class="header-title"><h1>Harmon <span>Hall</span></h1></div>
</div>

<div class="contenedor">
    <div class="seccion">
        <input type="text" id="textoBusqueda" placeholder="Ej: San Luis Potosí...">
        <button class="btn-buscar" onclick="buscarInstituto()">Buscar Ahora</button>
        <span id="statusCarga" style="display:block; margin-top:10px; font-size:0.8em; text-align:center;">Cargando base de datos...</span>
    </div>
    <div id="resultado"></div>
</div>

<script>
    let todosLosDatos = [];
    const archivosA_Cargar = ['database.xlsx', 'database2.xlsx']; 

    window.onload = async function() {
        for (const nombreArchivo of archivosA_Cargar) {
            try {
                const response = await fetch(nombreArchivo);
                const arrayBuffer = await response.arrayBuffer();
                const libro = XLSX.read(new Uint8Array(arrayBuffer), {type: 'array'});
                const json = XLSX.utils.sheet_to_json(libro.Sheets[libro.SheetNames[0]]);
                todosLosDatos = todosLosDatos.concat(json);
            } catch (e) { console.error("Error al cargar archivo", e); }
        }
        document.getElementById('statusCarga').innerText = "✅ " + todosLosDatos.length + " Institutos Listos";
    };

    function buscarInstituto() {
        const busqueda = document.getElementById('textoBusqueda').value.toLowerCase().trim();
        const caja = document.getElementById('resultado');
        const resultados = todosLosDatos.filter(f => f.Nombre && f.Nombre.toString().toLowerCase().includes(busqueda));

        if (resultados.length > 0) {
            let htmlTotal = "";
            resultados.forEach((encontrado, index) => {
                // Lógica de Wiki/Link
                let linkWiki = null;
                Object.keys(encontrado).forEach(col => {
                    if (col.toLowerCase().includes("wiki") || col.toLowerCase().includes("link")) linkWiki = encontrado[col];
                });

                // Lógica de Google Maps Dinámico
                const nombreReal = encontrado.Nombre;
                const queryMaps = encodeURIComponent(nombreReal + " Harmon Hall");
                const urlMapsAuto = `https://www.google.com/maps/search/?api=1&query=${queryMaps}`;

                // Renderizado de Tarjeta (Mantiene tu lógica de Precios/Zonas)
                let htmlCard = `
                    <div class="result-card">
                        <span class="instituto-nombre">${nombreReal}</span>
                        <span class="type-badge ${encontrado.Tipo?.toLowerCase().includes('franquicia') ? 'franchise' : 'own'}">${encontrado.Tipo || 'Propia'}</span>
                        
                        <div class="caja-info">
                            <span class="info-label">Zona ${encontrado.Zona || 'N/D'}</span>
                            <div class="info-grid">
                                <div class="info-item"><span class="info-label">Inscripción</span><span class="info-value">$${encontrado.Inscripcion || '-'}</span></div>
                                <div class="info-item"><span class="info-label">Precio FF</span><span class="info-value">$${encontrado.Precio_FF || '-'}</span></div>
                            </div>
                        </div>

                        <div class="botones-accion">
                            <a href="${urlMapsAuto}" target="_blank" class="btn-maps">
                                <i class="fas fa-map-marker-alt"></i> Ubicación
                            </a>
                `;

                if (linkWiki) {
                    let urlWiki = linkWiki.toString().startsWith('http') ? linkWiki : 'https://' + linkWiki;
                    htmlCard += `<a href="${urlWiki}" target="_blank" class="btn-wiki"><i class="fas fa-external-link-alt"></i> Wiki</a>`;
                }

                htmlCard += `</div></div>`;
                htmlTotal += htmlCard;
            });
            caja.innerHTML = htmlTotal;
        } else {
            caja.innerHTML = `<p style="text-align:center;">No se encontró "${busqueda}"</p>`;
        }
    }

    document.getElementById('textoBusqueda').addEventListener('keypress', (e) => { if (e.key === 'Enter') buscarInstituto(); });
</script>
</body>
</html>
