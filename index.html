<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmon Hall - Buscador</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --hh-yellow: #FFEA00;
            --hh-black: #000000;
            --hh-white: #FFFFFF;
            --hh-red: #cc1e3d;
            --bg: #FFEA00;
            --card-bg: #ffffff;
            --text: #111111;
            --header-text: #111111;
            --border: rgba(0,0,0,0.09);
            --input-bg: #ffffff;
            --input-border: #e5e5e5;
            --shadow: 0 20px 60px rgba(0,0,0,0.13);
            --shadow-soft: 0 10px 30px rgba(0,0,0,0.08);
            --radius-lg: 32px;
            --radius-md: 24px;
            --radius-pill: 999px;
        }
        
        [data-theme="dark"] {
            --bg: #0a0a0a;
            --card-bg: #1f1f1f;
            --text: #ffffff;
            --header-text: #FFEA00;
            --border: rgba(255,255,255,0.09);
            --input-bg: #2a2a2a;
            --input-border: #444;
            --shadow: 0 20px 60px rgba(0,0,0,0.45);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px 16px;
            min-height: 100vh;
            transition: background 0.5s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .status-pill {
            background: var(--card-bg);
            color: #2e7d32;
            padding: 10px 24px;
            border-radius: var(--radius-pill);
            font-weight: 700;
            font-size: 0.92em;
            box-shadow: var(--shadow-soft);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            backdrop-filter: blur(20px);
        }

        .header {
            width: 100%;
            max-width: 680px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .header-title h1 {
            margin: 0;
            font-size: clamp(2.2rem, 5.5vw, 2.85rem);
            font-weight: 900;
            color: var(--header-text);
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        .dark-mode-toggle {
            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: var(--radius-pill);
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border);
            font-weight: 800;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .dark-mode-toggle:hover { transform: scale(1.08); }

        .contenedor {
            width: 100%;
            max-width: 680px;
        }

        /* BUSCADOR */
        .busqueda-wrap {
            position: relative;
            z-index: 100; /* ← IMPORTANTE para que las sugerencias queden arriba */
            margin-bottom: 12px;
        }
        input[type="text"] {
            width: 100%;
            background: var(--input-bg);
            border: 3px solid var(--input-border);
            border-radius: 999px;
            padding: 18px 24px 18px 58px;
            font-size: 1.05em;
            box-shadow: var(--shadow-soft);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        input[type="text"]:focus {
            border-color: #FFEA00;
            box-shadow: 0 0 0 6px rgba(255,234,0,0.25);
        }
        .busqueda-wrap::before {
            content: "\f002";
            font-family: "Font Awesome 6 Free";
            position: absolute;
            left: 26px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.25em;
            color: #999;
            z-index: 2;
        }

        /* SUGERENCIAS - AHORA SIEMPRE ENCIMA DE TODO */
        .sugerencias {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            overflow: hidden;
            max-height: 360px;
            overflow-y: auto;
            z-index: 9999; /* ← FIX PRINCIPAL: siempre por encima de las tarjetas */
            border: 1px solid var(--border);
        }
        .sugerencia-item {
            padding: 16px 24px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.25s ease;
        }
        .sugerencia-item:hover,
        .sugerencia-item:first-child {
            background: rgba(255,234,0,0.22);
        }
        .sugerencia-sub {
            font-size: 0.85em;
            opacity: 0.75;
            display: block;
            margin-top: 2px;
        }

        .seccion {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 28px;
            margin-bottom: 28px;
            backdrop-filter: blur(20px);
        }

        /* TARJETA */
        .result-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: 28px;
            position: relative;
            overflow: hidden;
            animation: cardPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes cardPop {
            from { opacity: 0; transform: translateY(40px) scale(0.94); }
            to { opacity: 1; transform: none; }
        }

        .instituto-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .instituto-nombre {
            font-size: 1.55em;
            font-weight: 900;
            letter-spacing: -0.8px;
        }
        .type-badge {
            background: #111;
            color: white;
            padding: 6px 18px;
            border-radius: var(--radius-pill);
            font-size: 0.78em;
            font-weight: 900;
            margin-top: 6px;
            display: inline-block;
        }
        .type-badge.franchise {
            background: linear-gradient(180deg, #dd2447, #cc1e3d);
        }

        .school-icon {
            font-size: 2.2em;
            opacity: 0.25;
            margin-top: 6px;
        }

        .price-box {
            background: #f8f8f8;
            border-radius: 24px;
            padding: 20px;
            margin: 20px 0;
        }
        .price-header {
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95em;
        }
        .prices-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 1.05em;
        }
        .price-item {
            text-align: center;
        }
        .price-label {
            font-size: 0.78em;
            font-weight: 800;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .price-value {
            font-weight: 900;
            font-size: 1.22em;
        }

        /* BOTONES - ahora apilados como en tu imagen (rojo grande arriba, wiki pequeño abajo) */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 24px;
            align-items: center;
        }
        .btn-copiar {
            width: 100%;
            background: linear-gradient(180deg, #cc1e3d, #b81a34);
            color: white;
            border: none;
            padding: 17px 24px;
            border-radius: var(--radius-pill);
            font-weight: 900;
            text-transform: uppercase;
            font-size: 1.02em;
            box-shadow: 0 12px 28px rgba(204,30,61,0.3);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-copiar:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 36px rgba(204,30,61,0.4);
        }

        .btn-wiki {
            background: #FFEA00;
            color: #111;
            border: 3px solid #111;
            padding: 14px 32px;
            border-radius: var(--radius-pill);
            font-weight: 900;
            text-transform: uppercase;
            font-size: 0.95em;
            box-shadow: 0 10px 24px rgba(255,234,0,0.35);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
            min-width: 160px;
        }
        .btn-wiki:hover {
            transform: scale(1.08);
        }

        .empty-state {
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 28px;
            box-shadow: var(--shadow-soft);
            text-align: center;
            font-weight: 700;
        }

        @media (max-width: 640px) {
            .buttons-container { gap: 12px; }
        }
    </style>
</head>
<body data-theme="light">

<div class="header">
    <div class="header-title"><h1>Harmon <span>Hall</span></h1></div>
    <div class="dark-mode-toggle" onclick="toggleDarkMode()">
        <i id="darkModeIcon" class="fas fa-moon"></i> 
        <span>Noche</span>
    </div>
</div>

<div id="statusPill" class="status-pill" style="display:none;">
    <i class="fas fa-check-circle"></i> Base de datos lista.
</div>

<div class="contenedor">
    <div class="seccion">
        <label style="font-weight:900; font-size:0.9em; letter-spacing:1px;">BUSCADOR DE INSTITUTOS</label>
        <div class="busqueda-wrap">
            <input type="text" id="textoBusqueda" placeholder="Ej: Santa Catari..." autocomplete="off">
            <div id="sugerencias" class="sugerencias"></div>
        </div>
    </div>

    <div id="resultado"></div>
</div>

<script>
    let todosLosDatos = [];
    const archivosA_Cargar = ['database.xlsx', 'database2.xlsx'];

    function normalizarTexto(texto) {
        return (texto ?? "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }
    function escaparHTML(texto) {
        return (texto ?? "").toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function formatearMoneda(valor) {
        return "$" + (Number(valor) || 0).toLocaleString("es-MX");
    }

    function obtenerCotizacion(datos, programa) {
        let html = "";
        const zona = escaparHTML(datos.Zona || "A");
        const ins = formatearMoneda(datos.Inscripcion);
        const lib = formatearMoneda(datos.Libros_Adults || datos.Libros_KIDS);
        const mensu = formatearMoneda(programa === 'pro' ? datos.Adults_PRO_FF : datos.Adults_FF || datos.KPT_SEM);
        const sab = formatearMoneda(datos.Adults_SAB || datos.KPT_SAB);

        let titulo = "";
        if (programa === 'adults') titulo = "Adultos (1-20)";
        else if (programa === 'pro') titulo = "Adultos Pro (21-24)";
        else if (programa === 'kids') titulo = "Kids";
        else if (programa === 'pteen') titulo = "Pre-Teens";

        html = `
            <div class="price-box">
                <div class="price-header">
                    <i class="fas fa-tag"></i> ${titulo} | ZONA ${zona}
                </div>
                <div class="prices-row">
                    <div class="price-item"><div class="price-label">INSCRIPCIÓN</div><div class="price-value">${ins}</div></div>
                    <div class="price-item"><div class="price-label">LIBRO</div><div class="price-value">${lib}</div></div>
                    <div class="price-item"><div class="price-label">MENSUALIDAD<br>FF/SEM</div><div class="price-value">${mensu}</div></div>
                </div>
                <div style="text-align:center;">
                    <div class="price-label">MENSUALIDAD SABATINA</div>
                    <div class="price-value">${sab}</div>
                </div>
            </div>`;
        return html;
    }

    function mostrarNotificacion(mensaje) {
        const toast = document.createElement('div');
        toast.style.cssText = `position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#111; color:#FFEA00; padding:14px 28px; border-radius:999px; font-weight:900; box-shadow:0 16px 32px rgba(0,0,0,0.3); display:flex; align-items:center; gap:10px; animation:toastPop 2.8s forwards; z-index:9999;`;
        toast.innerHTML = `<i class="fas fa-check-circle"></i> ${mensaje}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2800);
    }

    async function copiarAlPortapapeles(texto) {
        await navigator.clipboard.writeText(texto);
        mostrarNotificacion("Resumen copiado con éxito");
    }

    function toggleDarkMode() {
        const body = document.body;
        const isLight = body.getAttribute('data-theme') === 'light';
        body.setAttribute('data-theme', isLight ? 'dark' : 'light');
        document.getElementById('darkModeIcon').className = isLight ? 'fas fa-sun' : 'fas fa-moon';
        document.querySelector('.dark-mode-toggle span').innerText = isLight ? 'Día' : 'Noche';
    }

    function actualizarCotizacion(index) {
        const sel = document.getElementById(`select-${index}`);
        const datos = JSON.parse(decodeURIComponent(sel.dataset.info));
        const cont = document.getElementById(`precios-${index}`);
        cont.innerHTML = obtenerCotizacion(datos, sel.value);
    }

    function copiarResumen(index) {
        const sel = document.getElementById(`select-${index}`);
        const datos = JSON.parse(decodeURIComponent(sel.dataset.info));
        const texto = `Instituto: ${datos.Nombre}\nTipo: ${datos.Tipo}\nZona: ${datos.Zona}\nPrograma: ${sel.value}\nInscripción: ${formatearMoneda(datos.Inscripcion)}\nLibro: ${formatearMoneda(datos.Libros_Adults)}\nMensualidad FF/SEM: ${formatearMoneda(datos.Adults_FF)}\nMensualidad Sabatina: ${formatearMoneda(datos.Adults_SAB)}`;
        copiarAlPortapapeles(texto);
    }

    function renderSugerencias(lista) {
        const cont = document.getElementById("sugerencias");
        if (!lista.length) { cont.style.display = "none"; return; }
        cont.innerHTML = lista.map(item => `
            <div class="sugerencia-item" data-nombre="${escaparHTML(item.Nombre)}">
                ${escaparHTML(item.Nombre)}
                <span class="sugerencia-sub">${escaparHTML(item.Tipo)} ${item.Zona ? '• Zona '+item.Zona : ''}</span>
            </div>
        `).join('');
        cont.style.display = "block";
    }

    function buscarInstituto() {
        const texto = document.getElementById('textoBusqueda').value.trim();
        const busqueda = normalizarTexto(texto);
        document.getElementById("sugerencias").style.display = "none";

        const resultados = todosLosDatos.filter(f => normalizarTexto(f.Nombre).includes(busqueda));
        
        let html = "";
        resultados.forEach((inst, i) => {
            const esFranquicia = (inst.Tipo || "").toLowerCase().includes("franquicia");
            const info = encodeURIComponent(JSON.stringify(inst));
            const wikiUrl = (inst.Wiki && inst.Wiki !== "#" && inst.Wiki.toLowerCase() !== "n/a") 
                ? (inst.Wiki.startsWith('http') ? inst.Wiki : 'https://'+inst.Wiki) : "";

            html += `
                <div class="result-card">
                    <div class="instituto-header">
                        <div>
                            <div class="instituto-nombre">${escaparHTML(inst.Nombre)}</div>
                            <span class="type-badge ${esFranquicia ? 'franchise' : ''}">${escaparHTML(inst.Tipo || 'Propia')}</span>
                        </div>
                        <i class="fas fa-school school-icon"></i>
                    </div>

                    <label style="font-size:0.85em; font-weight:800; letter-spacing:1px;">SELECCIONA PROGRAMA:</label>
                    <select id="select-${i}" class="btn-buscar" data-info="${info}" onchange="actualizarCotizacion(${i})" style="width:100%; background:var(--card-bg); border:2px solid #e5e5e5; border-radius:999px; padding:16px 20px; font-weight:700;">
                        <option value="adults">Adultos (1-20)</option>
                        <option value="pro">Adultos Pro (21-24)</option>
                        <option value="kids">Kids</option>
                        <option value="pteen">Pre-Teens</option>
                    </select>

                    <div id="precios-${i}"></div>

                    <div class="buttons-container">
                        <button class="btn-copiar" onclick="copiarResumen(${i})">
                            <i class="fas fa-copy"></i> COPIAR RESUMEN
                        </button>
                        ${wikiUrl ? `<a href="${wikiUrl}" target="_blank" class="btn-wiki">ABRIR WIKI</a>` : ''}
                    </div>
                </div>`;
        });

        document.getElementById('resultado').innerHTML = html || `<p class="empty-state">No se encontró ningún instituto con ese nombre.</p>`;

        resultados.forEach((_, i) => actualizarCotizacion(i));
    }

    window.onload = async () => {
        for (const arch of archivosA_Cargar) {
            try {
                const r = await fetch(arch);
                const ab = await r.arrayBuffer();
                const wb = XLSX.read(new Uint8Array(ab), {type: 'array'});
                todosLosDatos = todosLosDatos.concat(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]));
            } catch(e) {}
        }
        document.getElementById('statusPill').style.display = 'inline-flex';
    };

    document.addEventListener('DOMContentLoaded', () => {
        const input = document.getElementById('textoBusqueda');
        const sug = document.getElementById('sugerencias');

        input.addEventListener('input', () => {
            const val = normalizarTexto(input.value);
            if (!val) { sug.style.display = 'none'; return; }
            // MOSTRAR MÁS SUGERENCIAS (hasta 12)
            const lista = todosLosDatos.filter(f => normalizarTexto(f.Nombre).includes(val)).slice(0, 12);
            renderSugerencias(lista);
        });

        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') buscarInstituto();
        });

        sug.addEventListener('click', e => {
            const item = e.target.closest('.sugerencia-item');
            if (item) {
                input.value = item.dataset.nombre;
                sug.style.display = 'none';
                buscarInstituto();
            }
        });
    });
</script>
</body>
</html>
