<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmon Hall - Buscador</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --hh-yellow: #FFEA00;
            --hh-black: #000000;
            --hh-white: #FFFFFF;
            --hh-red: #cc1e3d;
            
            /* === NUEVA PALETA PREMIUM === */
            --bg: #FAF8E8;                    /* crema suave - mucho más elegante */
            --card-bg: rgba(255,255,255,0.96);
            --text: var(--hh-black);
            --header-text: var(--hh-black);
            --border: rgba(0,0,0,0.09);
            --input-bg: rgba(255,255,255,0.97);
            --input-border: rgba(0,0,0,0.14);
            --info-box: rgba(248,246,232,0.92);
            --alert-bg: #ffebee;
            --alert-text: var(--hh-red);
            --franchise-bg: rgba(255,240,240,0.94);
            --franchise-border: rgba(204,30,61,0.28);
            
            /* Glassmorphism mejorado */
            --shadow: 0 20px 60px rgba(0,0,0,0.11),
                      inset 0 1px 0 rgba(255,255,255,0.7),
                      inset 0 -1px 0 rgba(0,0,0,0.08);
            --shadow-soft: 0 12px 32px rgba(0,0,0,0.08);
            --shadow-lift: 0 28px 70px rgba(0,0,0,0.16);
            
            --radius-lg: 40px;
            --radius-md: 28px;
            --radius-sm: 18px;
        }

        [data-theme="dark"] {
            --bg: #0A0A0A;
            --card-bg: rgba(28,28,28,0.96);
            --text: #ffffff;
            --header-text: var(--hh-yellow);
            --border: rgba(255,255,255,0.09);
            --input-bg: rgba(35,35,35,0.96);
            --input-border: rgba(255,255,255,0.18);
            --info-box: rgba(40,40,40,0.88);
            --alert-bg: #4a151b;
            --alert-text: #ff8a9f;
            --franchise-bg: rgba(60,20,25,0.94);
            --franchise-border: rgba(204,30,61,0.38);
            
            --shadow: 0 20px 60px rgba(0,0,0,0.55),
                      inset 0 1px 0 rgba(255,255,255,0.08),
                      inset 0 -1px 0 rgba(0,0,0,0.4);
            --shadow-soft: 0 12px 32px rgba(0,0,0,0.45);
            --shadow-lift: 0 28px 70px rgba(0,0,0,0.65);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 24px 16px;
            min-height: 100vh;
            transition: background-color 0.6s cubic-bezier(0.32, 0.72, 0, 1);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* === FONDO MÁS ELEGANTE Y SUTIL === */
        .wave-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: linear-gradient(135deg,
                rgba(255,234,0,0.22) 0%,
                rgba(255,244,170,0.12) 50%,
                rgba(255,234,0,0.22) 100%);
            animation: waveFloat 32s ease-in-out infinite;
        }
        [data-theme="dark"] .wave-bg {
            background: linear-gradient(135deg,
                rgba(20,20,20,0.95) 0%,
                rgba(35,35,35,0.75) 50%,
                rgba(20,20,20,0.95) 100%);
        }

        @keyframes waveFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(25px, -25px) rotate(0.8deg); }
        }

        .header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 8px 28px;
            margin-bottom: 12px;
        }

        .header-title h1 {
            margin: 0;
            font-size: clamp(2.2rem, 5vw, 2.9rem);
            font-weight: 900;
            color: var(--header-text);
            letter-spacing: -2.2px;
            line-height: 1;
            text-transform: uppercase;
        }

        .dark-mode-toggle {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.93em;
            font-weight: 800;
            background: var(--card-bg);
            padding: 12px 22px;
            border-radius: 999px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .contenedor {
            width: 100%;
            max-width: 640px;
            position: relative;
        }

        .seccion {
            margin-bottom: 28px;
            padding: 32px 28px;
            border-radius: var(--radius-lg);
            background: var(--card-bg);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            backdrop-filter: blur(32px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .seccion:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lift);
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 22px 18px 58px;
            border: 2px solid var(--input-border);
            border-radius: 28px;
            outline: none;
            background: var(--input-bg);
            color: var(--text);
            font-size: 1.08em;
            font-weight: 500;
            box-shadow: inset 0 4px 14px rgba(0,0,0,0.04);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        input[type="text"]:focus {
            border-color: var(--hh-yellow);
            box-shadow: 0 0 0 6px rgba(255,234,0,0.25),
                        inset 0 4px 14px rgba(0,0,0,0.04);
            transform: translateY(-3px) scale(1.02);
        }

        .btn-buscar {
            width: 100%;
            padding: 19px 24px;
            background: linear-gradient(180deg, #111111 0%, #000000 100%);
            color: var(--hh-white);
            border: none;
            border-radius: 28px;
            cursor: pointer;
            font-weight: 900;
            font-size: 1.06em;
            text-transform: uppercase;
            letter-spacing: 0.9px;
            margin-top: 16px;
            box-shadow: 0 16px 32px rgba(0,0,0,0.24);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-buscar:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 24px 44px rgba(0,0,0,0.32);
        }

        .result-card {
            background: var(--card-bg);
            padding: 28px 26px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            backdrop-filter: blur(32px);
            transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: cardPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .result-card:hover {
            transform: translateY(-12px) scale(1.018);
            box-shadow: var(--shadow-lift);
        }

        @keyframes cardPop {
            from { opacity: 0; transform: translateY(40px) scale(0.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .result-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            height: 7px;
            width: 100%;
            background: linear-gradient(90deg, var(--hh-yellow), var(--hh-red));
        }

        .caja-info {
            margin-top: 18px;
            padding: 22px;
            border-radius: var(--radius-md);
            background: var(--info-box);
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
        }

        .caja-info.franchise {
            background: var(--franchise-bg);
            border-left: 6px solid var(--hh-red);
        }

        .buttons-wrapper .btn-wiki {
            background: linear-gradient(180deg, var(--hh-yellow), #ffe600);
            color: var(--hh-black);
            border: 2px solid var(--hh-black);
        }

        .buttons-wrapper .btn-copiar {
            background: linear-gradient(180deg, var(--hh-red), #b81a34);
            color: white;
        }

        .empty-state {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 40px 24px;
            text-align: center;
            font-weight: 800;
            box-shadow: var(--shadow-soft);
            color: var(--alert-text);
        }

        /* ===== HELP WIDGET MÁS PREMIUM ===== */
        .help-btn {
            background: linear-gradient(180deg, var(--hh-yellow), #ffe600);
            box-shadow: 0 16px 34px rgba(0,0,0,0.22);
        }

        .help-panel {
            border-radius: 28px;
            box-shadow: var(--shadow-lift);
            backdrop-filter: blur(28px);
        }

        @media (max-width: 768px) {
            body { padding: 16px 12px; }
            .seccion { padding: 24px 20px; }
            .result-card { padding: 24px 20px; }
        }
    </style>
</head>
<body data-theme="light">
<div class="wave-bg"></div>

<div class="header">
    <div class="logo-section">
        <div class="header-title"><h1>Harmon <span>Hall</span></h1></div>
    </div>
    <div class="dark-mode-toggle" onclick="toggleDarkMode()">
        <i id="darkModeIcon" class="fas fa-moon"></i>
        <span>Noche</span>
    </div>
</div>

<div class="contenedor">
    <div class="seccion" style="text-align: center; padding: 18px 24px; position:relative;">
        <i id="loadingSpinner" class="fas fa-spinner"></i>
        <span id="statusCarga">Conectando base de datos… ⏳</span>
    </div>

    <div class="seccion">
        <label>Buscador de Institutos</label>
        <div class="busqueda-wrap">
            <input type="text" id="textoBusqueda" placeholder="Ej: Santa Catari..." autocomplete="off" onfocus="this.select()">
            <div id="sugerencias" class="sugerencias"></div>
        </div>
        <button class="btn-buscar" onclick="buscarInstituto()">Buscar Ahora</button>
    </div>

    <div id="resultado"></div>
</div>

<!-- Botón flotante de ayuda -->
<div class="help-widget" id="helpWidget" aria-live="polite">
    <div class="help-panel" id="helpPanel" role="dialog" aria-label="Ayuda y contacto">
        <button class="help-close" type="button" onclick="toggleHelp(false)" aria-label="Cerrar ayuda">
            <i class="fas fa-times"></i>
        </button>
        <div class="help-title">
            <i class="fas fa-circle-question"></i>
            <span>Dudas o sugerencias</span>
        </div>
        <p class="help-text">
            Si detectas algo que se pueda mejorar o tienes alguna duda, contáctame por Teams.
        </p>
        <div class="help-email">
            <i class="fab fa-microsoft"></i> abraham.quintero@unid.mx
        </div>
    </div>
    <button class="help-btn" type="button" onclick="toggleHelp()" aria-label="Abrir ayuda">
        ?
    </button>
</div>

<script>
    /* === TODO EL JAVASCRIPT ORIGINAL (sin cambios) === */
    let todosLosDatos = [];
    let baseCargada = false;
    const archivosA_Cargar = ['database.xlsx', 'database2.xlsx'];

    function normalizarTexto(texto) {
        return (texto ?? "").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }
    function escaparHTML(texto) {
        return (texto ?? "").toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function formatearMoneda(valor) {
        const numero = Number(valor) || 0;
        return "$" + numero.toLocaleString("es-MX", { maximumFractionDigits: 0 });
    }

    function obtenerDirector(obj) {
        if (!obj || typeof obj !== "object") return "";
        for (let key in obj) {
            if (typeof key === "string" && key.toLowerCase().includes("director")) {
                const valor = obj[key];
                if (valor && valor.toString().trim() !== "") return valor.toString().trim();
            }
        }
        return "";
    }

    function obtenerCotizacion(datos, programa) {
        const ins = parseFloat(datos.Inscripcion) || 0;
        let html = "", texto = "", tienePrecio = false;

        if (['adults', 'pro', 'kids', 'pteen'].includes(programa)) {
            let mensu = 0, sab = 0, lib = 0, titulo = "";
            if (programa === 'adults') { mensu = parseFloat(datos.Adults_FF)||0; sab = parseFloat(datos.Adults_SAB)||0; lib = parseFloat(datos.Libros_Adults)||0; titulo = "Adultos (1-20)"; }
            else if (programa === 'pro') { mensu = parseFloat(datos.Adults_PRO_FF)||0; lib = parseFloat(datos.Libros_Adults)||0; titulo = "Adultos Pro (21-24)"; }
            else if (programa === 'kids') { mensu = parseFloat(datos.KPT_SEM)||0; sab = parseFloat(datos.KPT_SAB)||0; lib = parseFloat(datos.Libros_KIDS)||0; titulo = "Kids"; }
            else if (programa === 'pteen') { mensu = parseFloat(datos.KPT_SEM)||0; sab = parseFloat(datos.KPT_SAB)||0; lib = parseFloat(datos.Libros_PTEEN)||0; titulo = "Pre-Teens"; }

            if (mensu > 0 || sab > 0) tienePrecio = true;
            if (tienePrecio) {
                html = `<div class="caja-info"><span class="info-label"><i class="fas fa-tags"></i> ${escaparHTML(titulo)} | Zona ${escaparHTML(datos.Zona || 'A')}</span><div class="info-grid">${ins>0?`<div class="info-item"><span class="info-label">Inscripción</span><span class="info-value">${formatearMoneda(ins)}</span></div>`:''}${lib>0?`<div class="info-item"><span class="info-label">Libro</span><span class="info-value">${formatearMoneda(lib)}</span></div>`:''}${mensu>0?`<div class="info-item"><span class="info-label">Mensualidad FF/SEM</span><span class="info-value">${formatearMoneda(mensu)}</span></div>`:''}${sab>0?`<div class="info-item"><span class="info-label">Mensualidad Sabatina</span><span class="info-value">${formatearMoneda(sab)}</span></div>`:''}</div></div>`;
                texto = [`Programa: ${titulo}`,`Zona: ${datos.Zona||'A'}`,ins>0?`Inscripción: ${formatearMoneda(ins)}`:null,lib>0?`Libro: ${formatearMoneda(lib)}`:null,mensu>0?`Mensualidad FF/SEM: ${formatearMoneda(mensu)}`:null,sab>0?`Mensualidad Sabatina: ${formatearMoneda(sab)}`:null].filter(Boolean).join("\n");
            }
        } else {
            let total = 0, titulo = "";
            if (programa === 'toefl') { total = parseFloat(datos.TOEFL_ITP_PRE)||0; titulo = "PAGO ÚNICO TOEFL ITP"; }
            else if (programa === 'tkt') { total = parseFloat(datos.TKT)||0; titulo = "PAGO ÚNICO TKT"; }
            else if (programa === 'icc') { total = parseFloat(datos.ICC_FF)||0; titulo = "PAGO ÚNICO ICC"; }
            if (total > 0) tienePrecio = true;
            if (tienePrecio) {
                html = `<div class="caja-info" style="border-left:4px solid var(--hh-yellow); text-align:center;"><span class="info-label">${escaparHTML(titulo)}</span><div style="font-size:2.1em;font-weight:900;margin:12px 0;">${formatearMoneda(total)}</div><span class="info-label" style="font-size:0.75em;"><i class="fas fa-check-circle"></i> Todo incluido</span></div>`;
                texto = [`Programa: ${titulo}`,`Total: ${formatearMoneda(total)}`,`Todo incluido`].join("\n");
            }
        }
        if (!tienePrecio) {
            html = `<div class="caja-alerta"><i class="fas fa-exclamation-triangle"></i> Precios no definidos, valida la información.</div>`;
            texto = "Precios no definidos";
        }
        return { html, texto, tienePrecio };
    }

    function mostrarNotificacion(mensaje) {
        let container = document.querySelector('.toast-container') || (() => { 
            let c = document.createElement('div'); 
            c.className = 'toast-container'; 
            c.style.position='fixed'; 
            c.style.bottom='30px'; 
            c.style.left='50%'; 
            c.style.transform='translateX(-50%)'; 
            c.style.zIndex='9999'; 
            document.body.appendChild(c); 
            return c; 
        })();
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<i class="fas fa-check-circle"></i> ${escaparHTML(mensaje)}`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 2800);
    }

    async function copiarAlPortapapeles(texto) {
        try { await navigator.clipboard.writeText(texto); mostrarNotificacion("Resumen copiado"); }
        catch { 
            const area = document.createElement("textarea"); 
            area.value = texto; 
            area.style.position="fixed"; 
            area.style.opacity="0"; 
            document.body.appendChild(area); 
            area.select(); 
            document.execCommand("copy"); 
            document.body.removeChild(area); 
            mostrarNotificacion("Resumen copiado con éxito"); 
        }
    }

    function toggleDarkMode() {
        const body = document.body;
        const isLight = body.getAttribute('data-theme') === 'light';
        body.setAttribute('data-theme', isLight ? 'dark' : 'light');
        document.getElementById('darkModeIcon').className = isLight ? 'fas fa-sun' : 'fas fa-moon';
        document.querySelector('.dark-mode-toggle span').innerText = isLight ? 'Día' : 'Noche';
    }

    function toggleHelp(forceState) {
        const widget = document.getElementById('helpWidget');
        const shouldOpen = typeof forceState === 'boolean' ? forceState : !widget.classList.contains('open');
        widget.classList.toggle('open', shouldOpen);
    }

    function actualizarCotizacion(index) {
        const selector = document.getElementById(`select-${index}`);
        if (!selector) return;
        const programa = selector.value;
        const datos = JSON.parse(decodeURIComponent(selector.getAttribute('data-info')));
        const contenedor = document.getElementById(`precios-${index}`);
        if (!contenedor) return;
        const cotizacion = obtenerCotizacion(datos, programa);
        contenedor.innerHTML = cotizacion.html;
    }

    function copiarResumen(index) {
        const selector = document.getElementById(`select-${index}`);
        if (!selector) return;
        const programa = selector.value;
        const datos = JSON.parse(decodeURIComponent(selector.getAttribute('data-info')));
        const tipo = (datos.Tipo || "").toLowerCase();
        const classType = tipo.includes("franquicia") ? "franquicia" : "propio";
        const cotizacion = obtenerCotizacion(datos, programa);
        const director = obtenerDirector(datos);
      
        let textoBase = [
            `Instituto: ${datos.Nombre || 'N/D'}`,
            director ? `Director: ${director}` : null,
            `Tipo: ${datos.Tipo || 'Instituto'}`,
            `Categoría: ${classType === "franquicia" ? "Franquicia" : "Propio"}`,
            cotizacion.texto
        ].filter(Boolean).join("\n");
      
        if (classType === "franquicia") textoBase += `\n\nContacto Franquicia:\nCoordinador: ${datos.NOMBRE2 || "N/D"}\nTeléfono: ${datos.TELÉFONOS || datos.TELEFONOS || "N/D"}\nEmail: ${datos.EMAIL3 || datos.EMAIL || "N/D"}`;
        copiarAlPortapapeles(textoBase);
    }

    function renderSugerencias(lista) {
        const contenedor = document.getElementById("sugerencias");
        if (!lista.length) { contenedor.innerHTML = ""; contenedor.style.display = "none"; return; }
        contenedor.innerHTML = lista.map(item => `
            <div class="sugerencia-item" data-nombre="${escaparHTML(String(item.Nombre || ""))}">
                ${escaparHTML(item.Nombre || "Sin nombre")}
                <span class="sugerencia-sub">${escaparHTML(item.Tipo || "Instituto")}${item.Zona ? " • Zona " + escaparHTML(item.Zona) : ""}</span>
            </div>
        `).join("");
        contenedor.style.display = "block";
    }

    function actualizarSugerencias() {
        const busqueda = normalizarTexto(document.getElementById('textoBusqueda').value);
        if (!busqueda) { document.getElementById("sugerencias").style.display = "none"; return; }
        const sugerencias = todosLosDatos
            .filter(f => f.Nombre && normalizarTexto(f.Nombre).includes(busqueda))
            .sort((a,b) => {
                const na = normalizarTexto(a.Nombre), nb = normalizarTexto(b.Nombre);
                return (na.startsWith(busqueda) ? 0 : 1) - (nb.startsWith(busqueda) ? 0 : 1) || na.localeCompare(nb);
            })
            .slice(0, 12);
        renderSugerencias(sugerencias);
    }

    function seleccionarSugerencia(nombre) {
        document.getElementById('textoBusqueda').value = nombre;
        document.getElementById("sugerencias").style.display = "none";
        buscarInstituto();
    }

    function buscarInstituto() {
        const texto = document.getElementById('textoBusqueda').value.trim();
        const busqueda = normalizarTexto(texto);
        document.getElementById("sugerencias").style.display = "none";
        if (!busqueda) {
            document.getElementById('resultado').innerHTML = `<p class="empty-state">Escribe el nombre del instituto para buscar.</p>`;
            return;
        }
        const resultados = todosLosDatos.filter(f => f.Nombre && normalizarTexto(f.Nombre).includes(busqueda));
        let htmlTotal = "";

        resultados.forEach((encontrado, index) => {
            const infoJson = encodeURIComponent(JSON.stringify(encontrado));
            const tipo = (encontrado.Tipo || "").toLowerCase();
            const classType = tipo.includes("franquicia") ? "franchise" : "own";
            const director = obtenerDirector(encontrado);

            let directorHtml = director ? `
                <div class="caja-info" style="margin: 14px 0 18px 0; padding: 14px 20px; border-left: 4px solid var(--hh-yellow);">
                    <span class="info-label"><i class="fas fa-user-tie"></i> Director de Instituto</span>
                    <div class="info-value" style="font-size: 1.05em; margin-top: 6px;">${escaparHTML(director)}</div>
                </div>` : "";

            let franquiciaHtml = classType === "franchise" ? `
                <div class="caja-info franchise" style="margin:18px 0;">
                    <span class="info-label" style="margin-bottom:8px;display:block;"><i class="fas fa-headset"></i> Contacto Franquicia</span>
                    <div class="info-grid">
                        <div class="info-item"><span class="info-label">Coordinador</span><span class="info-value">${escaparHTML(encontrado.NOMBRE2||"N/D")}</span></div>
                        <div class="info-item"><span class="info-label">Teléfono</span><span class="info-value">${escaparHTML(encontrado.TELÉFONOS||encontrado.TELEFONOS||"N/D")}</span></div>
                        <div class="info-item" style="grid-column:span 2;"><span class="info-label">Email</span><span class="info-value" style="font-size:0.92em;">${escaparHTML(encontrado.EMAIL3||encontrado.EMAIL||"N/D")}</span></div>
                    </div>
                </div>` : "";

            let enlaceHtml = "";
            let linkUrl = (encontrado.Wiki||"").toString().trim();
            let tieneWiki = linkUrl && linkUrl !== "#" && linkUrl.toLowerCase() !== "n/a" && linkUrl.toLowerCase() !== "0";

            if (classType !== "franchise" && tieneWiki) {
                if (!linkUrl.startsWith('http')) linkUrl = 'https://' + linkUrl;
                enlaceHtml = `<a href="${escaparHTML(linkUrl)}" target="_blank" rel="noopener noreferrer" class="btn-wiki">Abrir wiki</a>`;
            } else if (classType !== "franchise") {
                enlaceHtml = `<div style="text-align:center;margin-top:24px;padding:14px;background:var(--info-box);border-radius:18px;font-weight:700;color:var(--text);opacity:0.75;"><i class="fas fa-info-circle"></i> Sin wiki disponible</div>`;
            }

            htmlTotal += `
                <div class="result-card">
                    <div class="instituto-header">
                        <div>
                            <span class="instituto-nombre">${escaparHTML(encontrado.Nombre||"Sin nombre")}</span><br>
                            <span class="type-badge ${classType}">${escaparHTML(encontrado.Tipo||'Instituto')}</span>
                        </div>
                        <i class="fas fa-school" style="font-size:1.8em;opacity:0.3;"></i>
                    </div>
                    ${directorHtml}
                    ${franquiciaHtml}
                    <label style="font-size:0.75em;opacity:0.8;">Selecciona Programa:</label>
                    <select id="select-${index}" class="btn-buscar" data-info="${infoJson}" onchange="actualizarCotizacion(${index})">
                        <option value="adults">Adultos (1-20)</option>
                        <option value="pro">Adultos Pro (21-24)</option>
                        <option value="kids">Kids</option>
                        <option value="pteen">Pre-Teens</option>
                        <option value="toefl">TOEFL ITP</option>
                        <option value="tkt">TKT</option>
                        <option value="icc">ICC</option>
                    </select>
                    <div id="precios-${index}"></div>
                  
                    <div class="buttons-wrapper">
                        <button class="btn-copiar" onclick="copiarResumen(${index})"><i class="fas fa-copy"></i> Copiar resumen</button>
                        ${enlaceHtml}
                    </div>
                </div>`;
        });

        document.getElementById('resultado').innerHTML = resultados.length ? htmlTotal : `<p class="empty-state">No se encontró nada para "${escaparHTML(texto)}".</p>`;
        if (resultados.length) resultados.forEach((_, i) => actualizarCotizacion(i));
    }

    window.onload = async function() {
        const spinner = document.getElementById('loadingSpinner');
        const status = document.getElementById('statusCarga');
        spinner.style.display = 'block';
        for (const archivo of archivosA_Cargar) {
            try {
                const response = await fetch(archivo);
                if (!response.ok) throw new Error(`Error ${response.status}`);
                const arrayBuffer = await response.arrayBuffer();
                const libro = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
                const json = XLSX.utils.sheet_to_json(libro.Sheets[libro.SheetNames[0]]);
                todosLosDatos = todosLosDatos.concat(json);
            } catch (e) {
                console.error("Error cargando " + archivo, e);
                status.innerHTML = "❌ Error al cargar algunos datos.";
            }
        }
        spinner.style.display = 'none';
        baseCargada = true;
        if (!status.innerHTML.includes("Error")) status.innerHTML = "✅ Base de datos lista.";
    };

    document.addEventListener('DOMContentLoaded', () => {
        const textoBusqueda = document.getElementById('textoBusqueda');
        const sugerencias = document.getElementById('sugerencias');
        textoBusqueda.addEventListener('input', actualizarSugerencias);
        textoBusqueda.addEventListener('keydown', e => {
            if (e.key === 'Enter') buscarInstituto();
            if (e.key === 'Escape') sugerencias.style.display = 'none';
        });
        sugerencias.addEventListener("click", e => {
            const item = e.target.closest(".sugerencia-item");
            if (item) seleccionarSugerencia(item.getAttribute("data-nombre"));
        });
        document.addEventListener("click", e => {
            if (!document.querySelector(".busqueda-wrap").contains(e.target)) sugerencias.style.display = "none";
            const helpWidget = document.getElementById('helpWidget');
            if (helpWidget && !helpWidget.contains(e.target)) {
                helpWidget.classList.remove('open');
            }
        });
    });
</script>
</body>
</html>
