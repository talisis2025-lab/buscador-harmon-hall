<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-hh-secure-v1' https://cdn.jsdelivr.net; style-src 'self' 'nonce-hh-secure-v1' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com data:; img-src 'self' data: https://strat-branding.com; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script';">

  <title>Harmon Hall - Buscador Seguro</title>
  <link rel="icon" type="image/jpeg" href="https://strat-branding.com/wp-content/uploads/2022/04/sb-harmon-hall.jpg" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script nonce="hh-secure-v1" src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script nonce="hh-secure-v1" src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style nonce="hh-secure-v1">
    :root {
      --hh-yellow: #ffea00;
      --hh-black: #000;
      --hh-white: #fff;
      --hh-red: #cc1e3d;
      --hh-green: #198754;
      --hh-blue: #0d6efd;
      --bg: var(--hh-yellow);
      --card-bg: rgba(255,255,255,.94);
      --text: var(--hh-black);
      --header-text: var(--hh-black);
      --border: rgba(0,0,0,.1);
      --input-bg: rgba(255,255,255,.96);
      --input-border: rgba(0,0,0,.14);
      --info-box: rgba(245,245,245,.9);
      --alert-bg: #ffebee;
      --alert-text: var(--hh-red);
      --franchise-bg: rgba(255,240,240,.94);
      --franchise-border: rgba(204,30,61,.28);
      --shadow: 0 20px 60px rgba(0,0,0,.12);
      --shadow-soft: 0 12px 30px rgba(0,0,0,.08);
      --shadow-lift: 0 30px 70px rgba(0,0,0,.18);
      --radius-lg: 28px;
      --radius-md: 18px;
    }

    [data-theme="dark"] {
      --bg: #0a0a0a;
      --card-bg: rgba(30,30,30,.94);
      --text: #fff;
      --header-text: var(--hh-yellow);
      --border: rgba(255,255,255,.1);
      --input-bg: rgba(40,40,40,.96);
      --input-border: rgba(255,255,255,.16);
      --info-box: rgba(45,45,45,.9);
      --alert-bg: #4a151b;
      --alert-text: #ff8a9f;
      --franchise-bg: rgba(60,20,25,.94);
      --franchise-border: rgba(204,30,61,.38);
      --shadow: 0 20px 60px rgba(0,0,0,.45);
      --shadow-soft: 0 12px 30px rgba(0,0,0,.35);
      --shadow-lift: 0 30px 70px rgba(0,0,0,.55);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wave-bg {
      position: fixed;
      inset: -80px;
      z-index: -2;
      background: linear-gradient(135deg, rgba(255,234,0,.75), rgba(255,244,170,.45), rgba(255,234,0,.75));
      animation: waveFloat 28s ease-in-out infinite;
    }

    [data-theme="dark"] .wave-bg {
      background: linear-gradient(135deg, rgba(20,20,20,.95), rgba(35,35,35,.75), rgba(20,20,20,.95));
    }

    .wave-bg::before {
      content: "";
      position: absolute;
      inset: -200px;
      background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), transparent 60%);
      animation: subtlePulse 18s ease-in-out infinite;
    }

    [data-theme="dark"] .wave-bg::before {
      background: radial-gradient(circle at 30% 20%, rgba(255,234,0,.22), transparent 65%);
    }

    @keyframes waveFloat {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(30px, -30px) rotate(1deg); }
    }

    @keyframes subtlePulse {
      0%, 100% { opacity: .35; transform: scale(1); }
      50% { opacity: .55; transform: scale(1.08); }
    }

    .header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 8px 28px;
      margin-bottom: 12px;
    }

    .header-title h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 900;
      color: var(--header-text);
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0;
      user-select: none;
    }

    .dark-mode-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: .92rem;
      font-weight: 800;
      background: var(--card-bg);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 999px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .contenedor {
      width: 100%;
      max-width: 640px;
      position: relative;
    }

    .seccion, .result-card {
      margin-bottom: 28px;
      padding: 30px 26px;
      border-radius: var(--radius-lg);
      background: var(--card-bg);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      backdrop-filter: blur(24px);
    }

    .status-section {
      text-align: center;
      padding: 18px 24px;
      position: relative;
      font-weight: 800;
    }

    #loadingSpinner {
      position: absolute;
      top: 22px;
      right: 24px;
      font-size: 1.2rem;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    label {
      display: block;
      margin-bottom: 12px;
      font-weight: 900;
      font-size: .85rem;
      text-transform: uppercase;
      letter-spacing: .6px;
      opacity: .85;
    }

    .busqueda-wrap {
      position: relative;
      z-index: 200;
    }

    .busqueda-wrap::before {
      content: "\f002";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      left: 22px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .45;
      z-index: 2;
    }

    input[type="text"] {
      width: 100%;
      padding: 18px 50px 18px 58px;
      border: 2px solid var(--input-border);
      border-radius: 28px;
      outline: none;
      background: var(--input-bg);
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 500;
      box-shadow: inset 0 4px 12px rgba(0,0,0,.04);
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--hh-yellow);
      box-shadow: 0 0 0 5px rgba(255,234,0,.22), inset 0 4px 12px rgba(0,0,0,.04);
    }

    .btn-limpiar {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 0;
      color: var(--text);
      opacity: 0;
      visibility: hidden;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 8px;
    }

    .btn-limpiar.visible {
      opacity: .55;
      visibility: visible;
    }

    .btn-buscar, .btn-copiar, .btn-wiki {
      width: 100%;
      padding: 18px 22px;
      border-radius: 28px;
      font-weight: 900;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .6px;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(0,0,0,.18);
      text-decoration: none;
      display: inline-block;
    }

    .btn-buscar {
      background: linear-gradient(180deg, #111, #000);
      color: var(--hh-white);
      border: 0;
      margin-top: 16px;
    }

    select.btn-buscar {
      background: var(--input-bg);
      border: 2px solid var(--input-border);
      color: var(--text);
      box-shadow: inset 0 3px 10px rgba(0,0,0,.06);
      appearance: none;
      text-transform: none;
    }

    .btn-copiar {
      background: var(--hh-red);
      color: #fff;
      border: 0;
    }

    .btn-wiki {
      background: var(--hh-yellow);
      color: var(--hh-black);
      border: 2px solid var(--hh-black);
    }

    .sugerencias {
      display: none;
      position: absolute;
      top: calc(100% + 12px);
      left: 0;
      right: 0;
      z-index: 9999;
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: var(--shadow-lift);
      backdrop-filter: blur(24px);
      overflow: hidden;
      max-height: 340px;
      overflow-y: auto;
      border: 1px solid var(--border);
    }

    .sugerencia-item {
      width: 100%;
      text-align: left;
      background: transparent;
      color: var(--text);
      border: 0;
      padding: 16px 22px;
      cursor: pointer;
      font-weight: 800;
    }

    .sugerencia-item:hover, .sugerencia-item:focus {
      background: rgba(255,234,0,.18);
      outline: none;
    }

    .sugerencia-sub {
      display: block;
      margin-top: 4px;
      font-size: .82rem;
      font-weight: 600;
      opacity: .7;
    }

    #resultado {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding-bottom: 120px;
    }

    .result-card {
      margin-bottom: 0;
      position: relative;
      overflow: hidden;
      animation: cardPop .45s ease forwards;
    }

    .result-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 6px;
      width: 100%;
      background: linear-gradient(90deg, var(--hh-yellow), var(--hh-red));
    }

    @keyframes cardPop {
      from { opacity: 0; transform: translateY(24px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .instituto-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 24px;
    }

    .instituto-nombre {
      font-size: 1.5rem;
      font-weight: 900;
      line-height: 1.15;
      word-break: break-word;
    }

    .card-icon {
      font-size: 1.7rem;
      opacity: .3;
      padding-top: 4px;
    }

    .type-badge {
      padding: 7px 16px;
      border-radius: 999px;
      font-size: .73rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: .6px;
      margin-top: 8px;
      display: inline-block;
    }

    .type-badge.own { background: var(--hh-green); }
    .type-badge.consolidado { background: var(--hh-blue); }
    .type-badge.franchise { background: var(--hh-red); }

    .panel-gris {
      background: var(--info-box);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 22px;
      margin-top: 20px;
      margin-bottom: 24px;
    }

    .panel-franchise {
      background: var(--franchise-bg);
      border-left: 5px solid var(--hh-red);
    }

    .private-note {
      margin: 8px 0 0;
      font-weight: 800;
      line-height: 1.4;
    }

    .grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 24px;
    }

    .data-stack {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .data-label {
      font-size: .72rem;
      font-weight: 800;
      color: #777;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .data-label i {
      margin-right: 6px;
      color: var(--text);
      opacity: .6;
    }

    .data-val {
      font-weight: 900;
      color: var(--text);
      font-size: 1.2rem;
      word-break: break-word;
    }

    .price-heading {
      display: block;
      margin-bottom: 16px;
    }

    .price-single {
      border-left: 5px solid var(--hh-yellow);
      text-align: center;
    }

    .price-total {
      font-size: 2rem;
      font-weight: 900;
      margin: 12px 0;
    }

    .caja-alerta {
      margin-top: 20px;
      margin-bottom: 24px;
      padding: 18px 20px;
      background: var(--alert-bg);
      color: var(--alert-text);
      border-radius: var(--radius-md);
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(204,30,61,.15);
    }

    .program-wrap {
      margin-top: 24px;
      margin-bottom: 24px;
    }

    .buttons-wrapper {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .no-wiki {
      text-align: center;
      padding: 16px;
      background: var(--info-box);
      border-radius: 18px;
      font-weight: 800;
      opacity: .65;
    }

    .empty-state {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      font-weight: 800;
      box-shadow: var(--shadow-soft);
      color: var(--alert-text);
    }

    .help-widget {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    .help-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 1.3rem;
      font-weight: 900;
      background: linear-gradient(180deg, var(--hh-yellow), #ffe600);
      color: #000;
      box-shadow: 0 14px 30px rgba(0,0,0,.22);
    }

    .help-panel {
      width: min(320px, calc(100vw - 36px));
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: var(--shadow-lift);
      backdrop-filter: blur(24px);
      padding: 16px 16px 14px;
      transform-origin: bottom right;
      transform: translateY(12px) scale(.95);
      opacity: 0;
      pointer-events: none;
      transition: all .22s ease;
      position: relative;
    }

    .help-widget.open .help-panel {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .help-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      margin-bottom: 8px;
      color: var(--header-text);
    }

    .help-text {
      margin: 0;
      line-height: 1.45;
      font-size: .95rem;
      font-weight: 600;
      opacity: .92;
    }

    .help-email {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,234,0,.18);
      font-weight: 800;
      word-break: break-word;
    }

    .help-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
      color: var(--text);
      opacity: .65;
    }

    .toast-container {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: grid;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: rgba(0,0,0,.88);
      color: var(--hh-yellow);
      padding: 14px 26px;
      border-radius: 999px;
      font-weight: 900;
      box-shadow: 0 16px 32px rgba(0,0,0,.3);
      animation: toastOut 2.8s ease forwards;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    [data-theme="dark"] .toast {
      background: var(--hh-yellow);
      color: #000;
    }

    @keyframes toastOut {
      0% { transform: translateY(60px) scale(.8); opacity: 0; }
      15% { transform: translateY(0) scale(1); opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(30px) scale(.95); opacity: 0; }
    }

    .clipboard-proxy {
      position: fixed;
      left: -9999px;
      top: -9999px;
      opacity: 0;
    }

    @media (max-width: 768px) {
      body { padding: 16px 12px; }
      .header { align-items: flex-start; }
      .seccion, .result-card { padding: 24px 20px; }
      .grid-2x2 { grid-template-columns: 1fr; }
      .help-widget { right: 12px; bottom: 12px; }
    }
  </style>
</head>

<body data-theme="light">
  <div class="wave-bg" aria-hidden="true"></div>

  <header class="header">
    <div class="header-title">
      <h1 id="logoHH">Harmon <span>Hall</span></h1>
    </div>

    <button id="themeToggle" class="dark-mode-toggle" type="button">
      <i id="darkModeIcon" class="fas fa-moon" aria-hidden="true"></i>
      <span id="themeLabel">Noche</span>
    </button>
  </header>

  <main class="contenedor">
    <section class="seccion status-section" aria-live="polite">
      <i id="loadingSpinner" class="fas fa-spinner" aria-hidden="true" hidden></i>
      <span id="statusCarga">Conectando base de datos... espera</span>
    </section>

    <section class="seccion">
      <label for="textoBusqueda">Buscador de Institutos</label>
      <div class="busqueda-wrap">
        <input type="text" id="textoBusqueda" placeholder="Ej: Santa Catari..." autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="80">
        <button id="btnLimpiar" class="btn-limpiar" type="button" aria-label="Limpiar búsqueda">
          <i class="fas fa-times" aria-hidden="true"></i>
        </button>
        <div id="sugerencias" class="sugerencias"></div>
      </div>
      <button id="searchButton" class="btn-buscar" type="button">Buscar Ahora</button>
    </section>

    <section id="resultado" aria-live="polite"></section>
  </main>

  <aside class="help-widget" id="helpWidget">
    <div class="help-panel" id="helpPanel" role="dialog" aria-label="Ayuda y contacto">
      <button id="helpClose" class="help-close" type="button" aria-label="Cerrar ayuda">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
      <div class="help-title">
        <i class="fas fa-circle-question" aria-hidden="true"></i>
        <span>Dudas o sugerencias</span>
      </div>
      <p class="help-text">Usa el canal interno autorizado para reportar cambios o dudas.</p>
      <div class="help-email">
        <i class="fab fa-microsoft" aria-hidden="true"></i>
        Canal interno de Teams
      </div>
    </div>

    <button id="helpToggle" class="help-btn" type="button" aria-label="Abrir ayuda">?</button>
  </aside>

  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script nonce="hh-secure-v1">
    (() => {
      "use strict";

      const CONFIG = Object.freeze({
        DATA_FILES: ["database.xlsx", "database2.xlsx"],
        SHOW_SENSITIVE_FIELDS: false,
        MAX_FILE_BYTES: 5 * 1024 * 1024,
        MAX_ROWS_PER_FILE: 5000,
        MAX_RESULTS: 25,
        MAX_SEARCH_CHARS: 80,
        FETCH_TIMEOUT_MS: 12000,
        MAX_PRICE: 1000000
      });

      const PUBLIC_FIELDS = new Set([
        "Nombre",
        "Tipo",
        "Zona",
        "Wiki",
        "Inscripcion",
        "Adults_FF",
        "Adults_SAB",
        "Adults_PRO_FF",
        "Libros_Adults",
        "KPT_SEM",
        "KPT_SAB",
        "Libros_KIDS",
        "Libros_PTEEN",
        "TOEFL_ITP_PRE",
        "TKT",
        "ICC_FF"
      ]);

      const SENSITIVE_FIELD_PATTERNS = [
        /^EMAIL/i,
        /^TEL/i,
        /^NOMBRE2$/i,
        /DIRECTOR/i,
        /DIRECCI/i,
        /PHONE/i,
        /CEL/i
      ];

      const PROGRAMS = new Map([
        ["adults", { title: "Adultos (1-20)", kind: "monthly", monthly: "Adults_FF", saturday: "Adults_SAB", book: "Libros_Adults" }],
        ["pro", { title: "Adultos (21-24)", kind: "monthly", monthly: "Adults_PRO_FF", saturday: "", book: "Libros_Adults" }],
        ["kids", { title: "Kids", kind: "monthly", monthly: "KPT_SEM", saturday: "KPT_SAB", book: "Libros_KIDS" }],
        ["pteen", { title: "Pre-Teens", kind: "monthly", monthly: "KPT_SEM", saturday: "KPT_SAB", book: "Libros_PTEEN" }],
        ["toefl", { title: "PAGO UNICO TOEFL ITP", kind: "single", total: "TOEFL_ITP_PRE" }],
        ["tkt", { title: "PAGO UNICO TKT", kind: "single", total: "TKT" }],
        ["icc", { title: "PAGO UNICO ICC", kind: "single", total: "ICC_FF" }]
      ]);

      const state = {
        rows: [],
        rowById: new Map(),
        baseLoaded: false,
        nextId: 1
      };

      const dom = {};

      function byId(id) {
        return document.getElementById(id);
      }

      function h(tag, options = {}, children = []) {
        const element = document.createElement(tag);

        for (const [key, value] of Object.entries(options)) {
          if (value === undefined || value === null || value === false) continue;

          if (key === "className") element.className = value;
          else if (key === "text") element.textContent = String(value);
          else if (key === "dataset") {
            for (const [dataKey, dataValue] of Object.entries(value)) {
              element.dataset[dataKey] = String(dataValue);
            }
          } else if (key === "attrs") {
            for (const [attr, attrValue] of Object.entries(value)) {
              if (attrValue !== undefined && attrValue !== null && attrValue !== false) {
                element.setAttribute(attr, String(attrValue));
              }
            }
          } else if (key in element) {
            element[key] = value;
          } else {
            element.setAttribute(key, String(value));
          }
        }

        appendChildren(element, Array.isArray(children) ? children : [children]);
        return element;
      }

      function appendChildren(parent, children) {
        for (const child of children.flat(Infinity)) {
          if (child === null || child === undefined || child === false) continue;
          if (child instanceof Node) parent.appendChild(child);
          else parent.appendChild(document.createTextNode(String(child)));
        }
      }

      function icon(className) {
        return h("i", { className, attrs: { "aria-hidden": "true" } });
      }

      function cleanText(value, maxLength = 180) {
        return String(value ?? "")
          .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, maxLength);
      }

      function normalizeText(value) {
        return cleanText(value, CONFIG.MAX_SEARCH_CHARS)
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .trim();
      }

      function clipboardSafe(value) {
        const text = cleanText(value, 400);
        return /^[=+\-@]/.test(text) ? "'" + text : text;
      }

      function toNumber(value) {
        const parsed = Number(String(value ?? "").replace(/[^0-9.-]/g, ""));
        if (!Number.isFinite(parsed) || parsed < 0 || parsed > CONFIG.MAX_PRICE) return 0;
        return parsed;
      }

      function money(value) {
        return "$" + toNumber(value).toLocaleString("es-MX", { maximumFractionDigits: 0 });
      }

      function shouldKeepField(key) {
        if (PUBLIC_FIELDS.has(key)) return true;
        return CONFIG.SHOW_SENSITIVE_FIELDS && SENSITIVE_FIELD_PATTERNS.some((pattern) => pattern.test(key));
      }

      function sanitizeRecord(raw) {
        if (!raw || typeof raw !== "object") return null;

        const record = {};
        for (const [rawKey, rawValue] of Object.entries(raw)) {
          const key = cleanText(rawKey, 80);
          if (!shouldKeepField(key)) continue;
          record[key] = cleanText(rawValue, key === "Wiki" ? 2048 : 220);
        }

        if (!record.Nombre) return null;
        record.__id = "inst-" + state.nextId++;
        return Object.freeze(record);
      }

      function getTypeInfo(row) {
        const type = normalizeText(row.Tipo);

        if (type.includes("franquicia")) {
          return { className: "franchise", label: "Franquicia" };
        }

        if (type.includes("consolidado")) {
          return { className: "consolidado", label: "Consolidado" };
        }

        return { className: "own", label: "Propia" };
      }

      function firstValue(row, keys) {
        for (const key of keys) {
          const value = cleanText(row[key], 220);
          if (value) return value;
        }
        return "";
      }

      function getDirector(row) {
        if (!CONFIG.SHOW_SENSITIVE_FIELDS) return "";
        for (const [key, value] of Object.entries(row)) {
          if (/director/i.test(key)) {
            const clean = cleanText(value, 220);
            if (clean) return clean;
          }
        }
        return "";
      }

      function safeWikiUrl(value) {
        const raw = cleanText(value, 2048);
        const lower = raw.toLowerCase();

        if (!raw || raw === "#" || lower === "n/a" || lower === "na" || lower === "0") return "";
        if (/^(javascript|data|file|vbscript):/i.test(raw) || raw.startsWith("//")) return "";

        try {
          const url = new URL(/^https?:\/\//i.test(raw) ? raw : "https://" + raw);
          url.protocol = "https:";
          url.username = "";
          url.password = "";
          return url.href;
        } catch {
          return "";
        }
      }

      function metric(label, value, iconClass) {
        const labelEl = h("span", { className: "data-label" });
        if (iconClass) labelEl.append(icon(iconClass), " ");
        labelEl.append(label);

        return h("div", { className: "data-stack" }, [
          labelEl,
          h("span", { className: "data-val", text: value })
        ]);
      }

      function buildQuote(row, programKey) {
        const program = PROGRAMS.get(programKey) || PROGRAMS.get("adults");
        const inscription = toNumber(row.Inscripcion);

        if (program.kind === "monthly") {
          const monthly = toNumber(row[program.monthly]);
          const saturday = program.saturday ? toNumber(row[program.saturday]) : 0;
          const book = toNumber(row[program.book]);
          const hasPrice = monthly > 0 || saturday > 0;

          if (!hasPrice) return emptyQuote();

          const gridItems = [];
          const textLines = [
            "Programa: " + program.title,
            "Zona: " + clipboardSafe(row.Zona || "A")
          ];

          if (inscription > 0) {
            gridItems.push(metric("Inscripción", money(inscription)));
            textLines.push("Inscripción: " + money(inscription));
          }

          if (book > 0) {
            gridItems.push(metric("Libro", money(book)));
            textLines.push("Libro: " + money(book));
          }

          if (monthly > 0) {
            gridItems.push(metric("Mensualidad FF/SEM", money(monthly)));
            textLines.push("Mensualidad Free Friday: " + money(monthly));
          }

          if (saturday > 0) {
            gridItems.push(metric("Mensualidad Sabatina", money(saturday)));
            textLines.push("Mensualidad Sabatina: " + money(saturday));
          }

          const heading = h("span", { className: "data-label price-heading" }, [
            icon("fas fa-tags"),
            " " + program.title + " | ZONA " + cleanText(row.Zona || "A", 30)
          ]);

          return {
            element: h("div", { className: "panel-gris" }, [
              heading,
              h("div", { className: "grid-2x2" }, gridItems)
            ]),
            text: textLines.join("\n")
          };
        }

        const total = toNumber(row[program.total]);
        if (total <= 0) return emptyQuote();

        return {
          element: h("div", { className: "panel-gris price-single" }, [
            h("span", { className: "data-label", text: program.title }),
            h("div", { className: "price-total", text: money(total) }),
            h("span", { className: "data-label" }, [
              icon("fas fa-check-circle"),
              " Todo incluido"
            ])
          ]),
          text: ["Programa: " + program.title, "Total: " + money(total), "Todo incluido"].join("\n")
        };
      }

      function emptyQuote() {
        return {
          element: h("div", { className: "caja-alerta" }, [
            icon("fas fa-exclamation-triangle"),
            h("span", { text: "Precios no definidos, valida la información." })
          ]),
          text: "Precios no definidos"
        };
      }

      function setStatus(message, isError = false) {
        dom.status.textContent = message;
        dom.status.classList.toggle("status-error", isError);
      }

      function setLoading(isLoading) {
        dom.spinner.hidden = !isLoading;
      }

      async function fetchWorkbook(fileName) {
        const controller = new AbortController();
        const timeoutId = window.setTimeout(() => controller.abort(), CONFIG.FETCH_TIMEOUT_MS);

        try {
          const response = await fetch(fileName, {
            cache: "no-store",
            credentials: "same-origin",
            referrerPolicy: "no-referrer",
            signal: controller.signal,
            headers: {
              "Accept": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/octet-stream,*/*"
            }
          });

          if (!response.ok) throw new Error("fetch_failed");

          const sizeHeader = Number(response.headers.get("content-length") || 0);
          if (sizeHeader > CONFIG.MAX_FILE_BYTES) throw new Error("file_too_large");

          const buffer = await response.arrayBuffer();
          if (buffer.byteLength > CONFIG.MAX_FILE_BYTES) throw new Error("file_too_large");

          const workbook = XLSX.read(new Uint8Array(buffer), {
            type: "array",
            cellFormula: false,
            cellHTML: false,
            cellNF: false,
            cellStyles: false
          });

          const firstSheetName = workbook.SheetNames[0];
          if (!firstSheetName) return [];

          const rows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName], {
            defval: "",
            raw: false,
            blankrows: false
          });

          return rows.slice(0, CONFIG.MAX_ROWS_PER_FILE);
        } finally {
          window.clearTimeout(timeoutId);
        }
      }

      async function loadData() {
        setLoading(true);
        setStatus("Conectando base de datos... espera");

        try {
          if (!window.XLSX) throw new Error("xlsx_missing");

          const files = await Promise.all(CONFIG.DATA_FILES.map(fetchWorkbook));
          const cleanRows = files.flat().map(sanitizeRecord).filter(Boolean);

          state.rows = cleanRows;
          state.rowById.clear();
          for (const row of cleanRows) state.rowById.set(row.__id, row);

          state.baseLoaded = true;
          setStatus("Base de datos pública lista: " + cleanRows.length + " registros.");
        } catch {
          state.baseLoaded = false;
          setStatus("No se pudo cargar la base de datos pública.", true);
        } finally {
          setLoading(false);
        }
      }

      function showToast(message) {
        const toast = h("div", { className: "toast" }, [
          icon("fas fa-check-circle"),
          h("span", { text: message })
        ]);

        dom.toastContainer.appendChild(toast);
        window.setTimeout(() => toast.remove(), 2800);
      }

      async function copyText(text) {
        const clean = text.replace(/\r/g, "");

        try {
          if (!navigator.clipboard || !window.isSecureContext) throw new Error("clipboard_unavailable");
          await navigator.clipboard.writeText(clean);
          showToast("Resumen copiado con éxito");
        } catch {
          const area = h("textarea", { className: "clipboard-proxy", value: clean, attrs: { "aria-hidden": "true" } });
          document.body.appendChild(area);
          area.select();

          try {
            const copied = document.execCommand("copy");
            showToast(copied ? "Resumen copiado con éxito" : "No se pudo copiar automáticamente");
          } catch {
            showToast("No se pudo copiar automáticamente");
          } finally {
            area.remove();
          }
        }
      }

      function clearSearch() {
        dom.searchInput.value = "";
        dom.suggestions.replaceChildren();
        dom.suggestions.style.display = "none";
        dom.clearButton.classList.remove("visible");
        dom.results.replaceChildren();
        dom.searchInput.focus();
      }

      function renderSuggestions(rows) {
        dom.suggestions.replaceChildren();

        if (!rows.length) {
          dom.suggestions.style.display = "none";
          return;
        }

        for (const row of rows) {
          const type = cleanText(row.Tipo || "Instituto", 80);
          const zone = row.Zona ? " • Zona " + cleanText(row.Zona, 30) : "";

          const button = h("button", {
            className: "sugerencia-item",
            type: "button",
            dataset: { id: row.__id }
          }, [
            h("span", { text: cleanText(row.Nombre, 120) }),
            h("span", { className: "sugerencia-sub", text: type + zone })
          ]);

          dom.suggestions.appendChild(button);
        }

        dom.suggestions.style.display = "block";
      }

      function updateSuggestions() {
        if (dom.searchInput.value.length > CONFIG.MAX_SEARCH_CHARS) {
          dom.searchInput.value = dom.searchInput.value.slice(0, CONFIG.MAX_SEARCH_CHARS);
        }

        const term = normalizeText(dom.searchInput.value);
        dom.clearButton.classList.toggle("visible", dom.searchInput.value.length > 0);

        if (!term || !state.baseLoaded) {
          dom.suggestions.replaceChildren();
          dom.suggestions.style.display = "none";
          return;
        }

        const suggestions = state.rows
          .filter((row) => normalizeText(row.Nombre).includes(term))
          .sort((a, b) => {
            const nameA = normalizeText(a.Nombre);
            const nameB = normalizeText(b.Nombre);
            return (nameA.startsWith(term) ? 0 : 1) - (nameB.startsWith(term) ? 0 : 1) || nameA.localeCompare(nameB);
          })
          .slice(0, 12);

        renderSuggestions(suggestions);
      }

      function selectSuggestion(rowId) {
        const row = state.rowById.get(rowId);
        if (!row) return;

        dom.searchInput.value = row.Nombre;
        dom.suggestions.replaceChildren();
        dom.suggestions.style.display = "none";
        dom.clearButton.classList.add("visible");
        searchInstitute();
      }

      function renderDirector(row) {
        const director = getDirector(row);
        if (!director) return null;

        return h("div", { className: "panel-gris" }, [
          h("span", { className: "data-label" }, [
            icon("fas fa-user-tie"),
            " Director de Instituto"
          ]),
          h("div", { className: "data-val", text: director })
        ]);
      }

      function renderFranchiseContact(row) {
        if (!CONFIG.SHOW_SENSITIVE_FIELDS) {
          return h("div", { className: "panel-gris panel-franchise" }, [
            h("span", { className: "data-label price-heading" }, [
              icon("fas fa-lock"),
              " Contacto protegido"
            ]),
            h("p", { className: "private-note", text: "Contacto oculto en la versión pública. Usa el canal interno autorizado." })
          ]);
        }

        const coord = firstValue(row, ["NOMBRE2"]) || "N/D";
        const tel = firstValue(row, ["TELÉFONOS", "TELEFONOS"]) || "N/D";
        const email = firstValue(row, ["EMAIL3", "EMAIL"]) || "N/D";

        return h("div", { className: "panel-gris panel-franchise" }, [
          h("span", { className: "data-label price-heading" }, [
            icon("fas fa-headset"),
            " Contacto Franquicia"
          ]),
          h("div", { className: "grid-2x2" }, [
            metric("Coordinador", coord),
            metric("Teléfono", tel),
            metric("Email", email)
          ])
        ]);
      }

      function renderProgramSelect(row, priceBox) {
        const select = h("select", { className: "btn-buscar", attrs: { "aria-label": "Selecciona programa" } });

        for (const [key, program] of PROGRAMS.entries()) {
          select.appendChild(h("option", { value: key, text: program.title.replace("PAGO UNICO ", "") }));
        }

        const updatePrice = () => {
          const quote = buildQuote(row, select.value);
          priceBox.replaceChildren(quote.element);
        };

        select.addEventListener("change", updatePrice);
        updatePrice();

        return select;
      }

      function copySummary(row, programKey) {
        const type = getTypeInfo(row);
        const quote = buildQuote(row, programKey);
        const director = getDirector(row);

        let summary;

        if (type.label === "Franquicia") {
          summary = [
            "Instituto: " + clipboardSafe(row.Nombre || "N/D"),
            "Categoría: Franquicia",
            "Contacto: oculto en la versión pública. Usa el canal interno autorizado.",
            "",
            "Si te interesa estudiar inglés en modalidad 100% online, podemos apoyarte con información de costos, niveles, clases privadas y promociones vigentes."
          ].join("\n");
        } else {
          summary = [
            "Instituto: " + clipboardSafe(row.Nombre || "N/D"),
            director ? "Director: " + clipboardSafe(director) : null,
            "Tipo: " + clipboardSafe(row.Tipo || "Instituto"),
            "Categoría: " + type.label,
            quote.text
          ].filter(Boolean).join("\n");
        }

        copyText(summary);
      }

      function renderResultCard(row) {
        const type = getTypeInfo(row);
        const priceBox = h("div");
        const select = renderProgramSelect(row, priceBox);
        const directorPanel = renderDirector(row);
        const wikiUrl = type.label !== "Franquicia" ? safeWikiUrl(row.Wiki) : "";
        const copyButton = h("button", { className: "btn-copiar", type: "button" }, [
          icon("fas fa-copy"),
          " Copiar Resumen"
        ]);

        copyButton.addEventListener("click", () => copySummary(row, select.value));

        const buttons = h("div", { className: "buttons-wrapper" }, [copyButton]);

        if (wikiUrl) {
          buttons.appendChild(h("a", {
            className: "btn-wiki",
            href: wikiUrl,
            target: "_blank",
            rel: "noopener noreferrer",
            referrerPolicy: "no-referrer"
          }, "Abrir Wiki"));
        } else if (type.label !== "Franquicia") {
          buttons.appendChild(h("div", { className: "no-wiki" }, [
            icon("fas fa-info-circle"),
            " Sin wiki disponible"
          ]));
        }

        return h("article", { className: "result-card" }, [
          h("div", { className: "instituto-header" }, [
            h("div", {}, [
              h("div", { className: "instituto-nombre", text: cleanText(row.Nombre || "Sin nombre", 120) }),
              h("span", { className: "type-badge " + type.className, text: type.label })
            ]),
            icon("fas fa-school card-icon")
          ]),
          directorPanel,
          type.label === "Franquicia" ? renderFranchiseContact(row) : null,
          h("div", { className: "program-wrap" }, [
            h("label", { text: "Selecciona Programa:" }),
            select
          ]),
          priceBox,
          buttons
        ]);
      }

      function renderEmpty(message) {
        dom.results.replaceChildren(h("p", { className: "empty-state", text: message }));
      }

      function searchInstitute() {
        const visibleText = cleanText(dom.searchInput.value, CONFIG.MAX_SEARCH_CHARS);
        const term = normalizeText(visibleText);
        dom.suggestions.replaceChildren();
        dom.suggestions.style.display = "none";

        if (!state.baseLoaded) {
          renderEmpty("Espera a que cargue la base de datos.");
          return;
        }

        if (!term) {
          renderEmpty("Escribe el nombre del instituto para buscar.");
          return;
        }

        const matches = state.rows
          .filter((row) => normalizeText(row.Nombre).includes(term))
          .slice(0, CONFIG.MAX_RESULTS);

        dom.results.replaceChildren();

        if (!matches.length) {
          renderEmpty('No se encontró nada para "' + visibleText + '".');
          return;
        }

        for (const row of matches) dom.results.appendChild(renderResultCard(row));
      }

      function toggleDarkMode() {
        const isLight = document.body.getAttribute("data-theme") === "light";
        document.body.setAttribute("data-theme", isLight ? "dark" : "light");
        dom.darkModeIcon.className = isLight ? "fas fa-sun" : "fas fa-moon";
        dom.themeLabel.textContent = isLight ? "Día" : "Noche";
      }

      function toggleHelp(forceState) {
        const shouldOpen = typeof forceState === "boolean" ? forceState : !dom.helpWidget.classList.contains("open");
        dom.helpWidget.classList.toggle("open", shouldOpen);
      }

      function bindEasterEgg() {
        let clickCount = 0;
        let clickTimer = null;

        dom.logo.style.cursor = "pointer";
        dom.logo.addEventListener("click", () => {
          clickCount += 1;
          window.clearTimeout(clickTimer);

          if (clickCount === 3) {
            const darkMode = document.body.getAttribute("data-theme") === "dark";
            const audioFile = darkMode ? "screamer.mp3" : "fnaf.mp3";
            const durationSeconds = darkMode ? 2 : 2.5;
            const audio = new Audio(audioFile);
            audio.volume = 0.6;
            audio.play().catch(() => {});

            window.setTimeout(() => {
              const fadeOut = window.setInterval(() => {
                if (audio.volume > 0.1) {
                  audio.volume = Math.max(0, audio.volume - 0.1);
                } else {
                  audio.pause();
                  audio.currentTime = 0;
                  window.clearInterval(fadeOut);
                }
              }, 50);
            }, durationSeconds * 1000);

            if (window.confetti) {
              window.confetti({
                particleCount: 150,
                spread: 90,
                origin: { y: 0.5 },
                zIndex: 10000,
                colors: darkMode
                  ? ["#cc1e3d", "#000000", "#ffffff"]
                  : ["#ffea00", "#cc1e3d", "#198754", "#0d6efd", "#ffffff"]
              });
            }

            clickCount = 0;
          } else {
            clickTimer = window.setTimeout(() => {
              clickCount = 0;
            }, 800);
          }
        });
      }

      function bindEvents() {
        dom.themeToggle.addEventListener("click", toggleDarkMode);
        dom.helpToggle.addEventListener("click", () => toggleHelp());
        dom.helpClose.addEventListener("click", () => toggleHelp(false));
        dom.clearButton.addEventListener("click", clearSearch);
        dom.searchButton.addEventListener("click", searchInstitute);
        dom.searchInput.addEventListener("focus", () => dom.searchInput.select());
        dom.searchInput.addEventListener("input", updateSuggestions);
        dom.searchInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") searchInstitute();
          if (event.key === "Escape") dom.suggestions.style.display = "none";
        });

        dom.suggestions.addEventListener("click", (event) => {
          const item = event.target.closest(".sugerencia-item");
          if (item) selectSuggestion(item.dataset.id);
        });

        document.addEventListener("click", (event) => {
          if (!event.target.closest(".busqueda-wrap")) dom.suggestions.style.display = "none";
          if (!dom.helpWidget.contains(event.target)) dom.helpWidget.classList.remove("open");
        });

        document.addEventListener("securitypolicyviolation", () => {
          setStatus("El navegador bloqueó un recurso no permitido por seguridad.", true);
        }, { once: true });

        bindEasterEgg();
      }

      document.addEventListener("DOMContentLoaded", () => {
        dom.logo = byId("logoHH");
        dom.themeToggle = byId("themeToggle");
        dom.darkModeIcon = byId("darkModeIcon");
        dom.themeLabel = byId("themeLabel");
        dom.spinner = byId("loadingSpinner");
        dom.status = byId("statusCarga");
        dom.searchInput = byId("textoBusqueda");
        dom.clearButton = byId("btnLimpiar");
        dom.searchButton = byId("searchButton");
        dom.suggestions = byId("sugerencias");
        dom.results = byId("resultado");
        dom.helpWidget = byId("helpWidget");
        dom.helpToggle = byId("helpToggle");
        dom.helpClose = byId("helpClose");
        dom.toastContainer = byId("toastContainer");

        bindEvents();
        loadData();
      });
    })();
  </script>
</body>
</html>
