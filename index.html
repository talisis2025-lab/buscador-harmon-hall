<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmon Hall - Buscador</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --hh-yellow: #FFEA00;
            --hh-black: #000000;
            --hh-white: #FFFFFF;
            --hh-red: #cc1e3d;

            --bg: var(--hh-yellow);
            --card-bg: var(--hh-white);
            --text: var(--hh-black);
            --header-text: var(--hh-black);
            --border: #e8eaed;
            --input-bg: #ffffff;
            --input-border: #e4e4e4;
            --info-box: #f6f6f6;
            --alert-bg: #ffebee;
            --alert-text: #cc1e3d;
            --franchise-bg: #fff8f8;
            --franchise-border: #ffcdd2;
            --shadow: 0 18px 50px rgba(0,0,0,0.08);
            --shadow-soft: 0 10px 24px rgba(0,0,0,0.06);
            --radius-lg: 22px;
            --radius-md: 16px;
            --radius-sm: 12px;
        }

        [data-theme="dark"] {
            --bg: #111111;
            --card-bg: #1f1f1f;
            --text: #ffffff;
            --header-text: var(--hh-yellow);
            --border: #323232;
            --input-bg: #2a2a2a;
            --input-border: #3b3b3b;
            --info-box: #262626;
            --alert-bg: #4a151b;
            --alert-text: #ff8a9f;
            --franchise-bg: #301b1e;
            --franchise-border: #5c262e;
            --shadow: 0 18px 50px rgba(0,0,0,0.25);
            --shadow-soft: 0 10px 24px rgba(0,0,0,0.18);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
            position: relative;
        }

        .wave-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(180deg, rgba(255,234,0,1) 0%, rgba(255,244,170,1) 100%);
        }

        [data-theme="dark"] .wave-bg {
            background:
                linear-gradient(180deg, #0f0f0f 0%, #1c1c1c 100%);
        }

        .wave-bg::before,
        .wave-bg::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            filter: blur(20px);
            opacity: 0.35;
            pointer-events: none;
        }

        .wave-bg::before {
            width: 420px;
            height: 420px;
            top: -120px;
            left: -140px;
            background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 70%);
        }

        .wave-bg::after {
            width: 360px;
            height: 360px;
            right: -120px;
            bottom: -100px;
            background: radial-gradient(circle, rgba(204,30,61,0.18) 0%, rgba(204,30,61,0) 70%);
        }

        .header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 8px 22px;
            margin-bottom: 10px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title h1 {
            margin: 0;
            font-size: clamp(1.9rem, 3vw, 2.35rem);
            font-weight: 900;
            color: var(--header-text);
            letter-spacing: -1px;
            line-height: 1;
            text-transform: uppercase;
        }

        .header-title h1 span {
            color: var(--text);
        }

        [data-theme="dark"] .header-title h1 span {
            color: var(--hh-white);
        }

        .dark-mode-toggle {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
            cursor: pointer;
            color: var(--text);
            font-weight: 900;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 999px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border);
            user-select: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .dark-mode-toggle:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .dark-mode-toggle i {
            font-size: 1rem;
        }

        .contenedor {
            width: 100%;
            max-width: 620px;
            position: relative;
        }

        .seccion {
            margin-bottom: 20px;
            padding: 26px;
            border-radius: var(--radius-lg);
            background-color: var(--card-bg);
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.04);
            backdrop-filter: blur(4px);
        }

        [data-theme="dark"] .seccion {
            border-color: rgba(255,255,255,0.04);
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 900;
            color: var(--text);
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .busqueda-wrap {
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            padding: 17px 20px;
            border: 2px solid var(--input-border);
            border-radius: 16px;
            outline: none;
            background-color: var(--input-bg);
            color: var(--text);
            font-size: 1.02em;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease, background-color 0.2s ease;
        }

        input[type="text"]::placeholder {
            color: #9b9b9b;
        }

        input[type="text"]:focus {
            border-color: var(--hh-black);
            box-shadow: 0 0 0 4px rgba(0,0,0,0.06);
            transform: translateY(-1px);
        }

        [data-theme="dark"] input[type="text"]:focus {
            box-shadow: 0 0 0 4px rgba(255,234,0,0.08);
        }

        .btn-buscar {
            width: 100%;
            padding: 15px 20px;
            background: linear-gradient(180deg, #111111 0%, #000000 100%);
            color: var(--hh-white);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 900;
            font-size: 1.02em;
            text-transform: uppercase;
            margin-top: 12px;
            letter-spacing: 0.5px;
            box-shadow: 0 12px 20px rgba(0,0,0,0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .btn-buscar:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 24px rgba(0,0,0,0.16);
            filter: brightness(0.98);
        }

        .btn-buscar:active {
            transform: translateY(0);
        }

        select.btn-buscar {
            background-color: var(--input-bg);
            color: var(--text);
            border: 2px solid var(--input-border);
            border-radius: 14px;
            text-transform: none;
            padding: 13px 14px;
            margin-bottom: 15px;
            font-weight: 800;
            box-shadow: none;
        }

        select.btn-buscar:hover {
            transform: none;
        }

        #resultado {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 40px;
        }

        .result-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 22px;
            box-shadow: var(--shadow);
            position: relative;
            border: 1px solid rgba(0,0,0,0.04);
            overflow: hidden;
            animation: fade-in-card 0.45s ease-out forwards;
            transition: transform 0.22s ease, box-shadow 0.22s ease;
        }

        .result-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            height: 5px;
            width: 100%;
            background: linear-gradient(90deg, var(--hh-black) 0%, var(--hh-red) 100%);
        }

        .result-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 24px 52px rgba(0,0,0,0.11);
        }

        @keyframes fade-in-card {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .instituto-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
            gap: 12px;
        }

        .instituto-nombre {
            font-size: 1.35em;
            font-weight: 900;
            color: var(--text);
            line-height: 1.15;
            letter-spacing: -0.2px;
        }

        .type-badge {
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.72em;
            font-weight: 900;
            color: var(--hh-white);
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .type-badge.own {
            background: linear-gradient(180deg, #111 0%, #000 100%);
        }

        .type-badge.franchise {
            background: linear-gradient(180deg, #dd2447 0%, #cc1e3d 100%);
        }

        .caja-info {
            margin-top: 15px;
            padding: 16px;
            border-radius: 16px;
            background-color: var(--info-box);
            border: 1px solid rgba(0,0,0,0.04);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-label {
            color: #888;
            font-weight: 800;
            font-size: 0.78em;
            text-transform: uppercase;
            letter-spacing: 0.35px;
        }

        .info-value {
            font-weight: 900;
            color: var(--text);
            font-size: 1.05em;
            word-break: break-word;
            line-height: 1.25;
        }

        .caja-info.franchise {
            background-color: var(--franchise-bg);
            border: 1px solid var(--franchise-border);
            border-left: 4px solid var(--hh-red);
        }

        .caja-alerta {
            margin-top: 15px;
            padding: 12px 14px;
            background-color: var(--alert-bg);
            color: var(--alert-text);
            border-radius: 14px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.92em;
            border: 1px solid rgba(204,30,61,0.12);
        }

        .btn-wiki {
            display: block;
            margin-top: 18px;
            padding: 14px 15px;
            background: linear-gradient(180deg, #FFEA00 0%, #ffe600 100%);
            color: var(--hh-black);
            text-decoration: none;
            border-radius: 16px;
            font-weight: 900;
            text-align: center;
            border: 2px solid var(--hh-black);
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .btn-wiki:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 26px rgba(0,0,0,0.12);
            filter: brightness(0.98);
        }

        .btn-copiar {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 14px 15px;
            background: linear-gradient(180deg, #dd2447 0%, #cc1e3d 100%);
            color: var(--hh-white);
            border: none;
            border-radius: 16px;
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(204,30,61,0.14);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .btn-copiar:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 26px rgba(204,30,61,0.18);
            filter: brightness(0.99);
        }

        .btn-copiar:active,
        .btn-wiki:active {
            transform: translateY(0);
        }

        #loadingSpinner {
            display: none;
            position: absolute;
            top: 25px;
            right: 25px;
            animation: spin 1s linear infinite;
            color: var(--text);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .sugerencias {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            z-index: 50;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 14px 32px rgba(0,0,0,0.12);
            overflow: hidden;
            max-height: 260px;
            overflow-y: auto;
            backdrop-filter: blur(4px);
        }

        .sugerencia-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-weight: 700;
            color: var(--text);
            transition: background-color 0.15s ease;
        }

        .sugerencia-item:hover {
            background: var(--info-box);
        }

        .sugerencia-item:last-child {
            border-bottom: none;
        }

        .sugerencia-sub {
            display: block;
            margin-top: 4px;
            font-size: 0.78em;
            font-weight: 600;
            opacity: 0.7;
        }

        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            pointer-events: none;
        }

        .toast {
            background: var(--hh-black);
            color: var(--hh-yellow);
            padding: 12px 24px;
            border-radius: 999px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 0.85em;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideUp 0.3s ease-out, fadeOut 0.3s ease-in 2.2s forwards;
            letter-spacing: 0.3px;
        }

        [data-theme="dark"] .toast {
            background: var(--hh-yellow);
            color: var(--hh-black);
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        .empty-state {
            color: var(--alert-text);
            text-align: center;
            font-weight: 800;
            background: var(--card-bg);
            border-radius: 18px;
            padding: 16px 18px;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(204,30,61,0.08);
        }

        @media (max-width: 768px) {
            body {
                padding: 14px;
            }

            .header {
                max-width: 100%;
                padding: 14px 4px 18px;
            }

            .seccion {
                padding: 20px;
                border-radius: 18px;
            }

            .result-card {
                padding: 20px;
            }

            .instituto-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .dark-mode-toggle {
                padding: 10px 14px;
            }
        }

        @media (max-width: 480px) {
            .header-title h1 {
                font-size: 1.65rem;
            }

            .btn-buscar,
            .btn-wiki,
            .btn-copiar {
                border-radius: 14px;
            }

            input[type="text"] {
                font-size: 16px;
            }
        }
    </style>
</head>
<body data-theme="light">

<div class="wave-bg"></div>

<div class="header">
    <div class="logo-section">
        <div class="header-title"><h1>Harmon <span>Hall</span></h1></div>
    </div>
    <div class="dark-mode-toggle" onclick="toggleDarkMode()">
        <i id="darkModeIcon" class="fas fa-moon"></i> <span>Noche</span>
    </div>
</div>

<div class="contenedor">
    <div class="seccion" style="text-align: center; padding: 15px 20px;">
        <i id="loadingSpinner" class="fas fa-spinner"></i>
        <span id="statusCarga">Conectando base de datos... ⏳</span>
    </div>

    <div class="seccion">
        <label>Buscador de Institutos</label>
        <div class="busqueda-wrap">
            <input type="text" id="textoBusqueda" placeholder="Ej: Santa Catari..." onfocus="this.select()">
            <div id="sugerencias" class="sugerencias"></div>
        </div>
        <button class="btn-buscar" onclick="buscarInstituto()">Buscar Ahora</button>
    </div>

    <div id="resultado"></div>
</div>

<script>
    let todosLosDatos = [];
    const archivosA_Cargar = ['database.xlsx', 'database2.xlsx']; 

    function normalizarTexto(texto) {
        return (texto ?? "")
            .toString()
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .trim();
    }

    function formatearMoneda(valor) {
        const numero = Number(valor) || 0;
        return "$" + numero.toLocaleString("es-MX", { maximumFractionDigits: 0 });
    }

    function obtenerCotizacion(datos, programa) {
        const ins = parseFloat(datos.Inscripcion) || 0;
        let html = "";
        let texto = "";
        let tienePrecio = false;

        if (['adults', 'pro', 'kids', 'pteen'].includes(programa)) {
            let mensu = 0, sab = 0, lib = 0, titulo = "";

            if (programa === 'adults') {
                mensu = parseFloat(datos.Adults_FF) || 0;
                sab = parseFloat(datos.Adults_SAB) || 0;
                lib = parseFloat(datos.Libros_Adults) || 0;
                titulo = "Adultos (1-20)";
            } else if (programa === 'pro') {
                mensu = parseFloat(datos.Adults_PRO_FF) || 0;
                lib = parseFloat(datos.Libros_Adults) || 0;
                titulo = "Adultos Pro (21-24)";
            } else if (programa === 'kids') {
                mensu = parseFloat(datos.KPT_SEM) || 0;
                sab = parseFloat(datos.KPT_SAB) || 0;
                lib = parseFloat(datos.Libros_KIDS) || 0;
                titulo = "Kids";
            } else if (programa === 'pteen') {
                mensu = parseFloat(datos.KPT_SEM) || 0;
                sab = parseFloat(datos.KPT_SAB) || 0;
                lib = parseFloat(datos.Libros_PTEEN) || 0;
                titulo = "Pre-Teens";
            }
            
            if (mensu > 0 || sab > 0) tienePrecio = true;

            if (tienePrecio) {
                html = `<div class="caja-info">
                    <span class="info-label"><i class="fas fa-tags"></i> ${titulo} | Zona ${datos.Zona || 'A'}</span>
                    <div class="info-grid">
                        ${ins > 0 ? `<div class="info-item"><span class="info-label">Inscripción</span><span class="info-value">${formatearMoneda(ins)}</span></div>` : ''}
                        ${lib > 0 ? `<div class="info-item"><span class="info-label">Libro</span><span class="info-value">${formatearMoneda(lib)}</span></div>` : ''}
                        ${mensu > 0 ? `<div class="info-item" style="background:rgba(0,0,0,0.04); padding:8px; border-radius:8px;"><span class="info-label">Mensualidad FF/SEM</span><span class="info-value">${formatearMoneda(mensu)}</span></div>` : ''}
                        ${sab > 0 ? `<div class="info-item" style="background:rgba(0,0,0,0.04); padding:8px; border-radius:8px;"><span class="info-label">Mensualidad Sabatina</span><span class="info-value">${formatearMoneda(sab)}</span></div>` : ''}
                    </div>
                </div>`;

                texto = [
                    `Programa: ${titulo}`,
                    `Zona: ${datos.Zona || 'A'}`,
                    ins > 0 ? `Inscripción: ${formatearMoneda(ins)}` : null,
                    lib > 0 ? `Libro: ${formatearMoneda(lib)}` : null,
                    mensu > 0 ? `Mensualidad FF/SEM: ${formatearMoneda(mensu)}` : null,
                    sab > 0 ? `Mensualidad Sabatina: ${formatearMoneda(sab)}` : null
                ].filter(Boolean).join("\n");
            }
        } else {
            let total = 0, titulo = "";

            if (programa === 'toefl') {
                total = parseFloat(datos.TOEFL_ITP_PRE) || 0;
                titulo = "PAGO ÚNICO TOEFL ITP";
            } else if (programa === 'tkt') {
                total = parseFloat(datos.TKT) || 0;
                titulo = "PAGO ÚNICO TKT";
            } else if (programa === 'icc') {
                total = parseFloat(datos.ICC_FF) || 0;
                titulo = "PAGO ÚNICO ICC";
            }

            if (total > 0) tienePrecio = true;

            if (tienePrecio) {
                html = `<div class="caja-info" style="border-left: 4px solid var(--hh-yellow); text-align:center;">
                    <span class="info-label">${titulo}</span>
                    <div style="font-size: 2em; font-weight: 900; margin: 10px 0;">${formatearMoneda(total)}</div>
                    <span class="info-label" style="font-size:0.7em;"><i class="fas fa-check-circle"></i> Todo incluido</span>
                </div>`;

                texto = [
                    `Programa: ${titulo}`,
                    `Total: ${formatearMoneda(total)}`,
                    `Todo incluido`
                ].join("\n");
            }
        }

        if (!tienePrecio) {
            html = `
                <div class="caja-alerta">
                    <i class="fas fa-exclamation-triangle"></i> Precios no definidos, valida la información.
                </div>
            `;
            texto = "Precios no definidos, valida la información.";
        }

        return { html, texto, tienePrecio };
    }

    function mostrarNotificacion(mensaje) {
        let container = document.querySelector('.toast-container');
        if (!container) {
            container = document.createElement('div');
            container.className = 'toast-container';
            document.body.appendChild(container);
        }

        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<i class="fas fa-check-circle"></i> ${mensaje}`;
        
        container.appendChild(toast);

        setTimeout(() => {
            toast.remove();
        }, 2500);
    }

    async function copiarAlPortapapeles(texto) {
        try {
            await navigator.clipboard.writeText(texto);
            mostrarNotificacion("Resumen copiado con éxito");
        } catch (error) {
            const area = document.createElement("textarea");
            area.value = texto;
            document.body.appendChild(area);
            area.select();
            document.execCommand("copy");
            document.body.removeChild(area);
            mostrarNotificacion("Resumen copiado con éxito");
        }
    }

    function toggleDarkMode() {
        const body = document.body;
        const isLight = body.getAttribute('data-theme') === 'light';
        body.setAttribute('data-theme', isLight ? 'dark' : 'light');
        document.getElementById('darkModeIcon').className = isLight ? 'fas fa-sun' : 'fas fa-moon';
        document.querySelector('.dark-mode-toggle span').innerText = isLight ? 'Día' : 'Noche';
    }

    function actualizarCotizacion(index) {
        const selector = document.getElementById(`select-${index}`);
        const programa = selector.value;
        const datos = JSON.parse(decodeURIComponent(selector.getAttribute('data-info')));
        const contenedor = document.getElementById(`precios-${index}`);

        const cotizacion = obtenerCotizacion(datos, programa);
        contenedor.innerHTML = cotizacion.html;
    }

    function copiarResumen(index) {
        const selector = document.getElementById(`select-${index}`);
        const programa = selector.value;
        const datos = JSON.parse(decodeURIComponent(selector.getAttribute('data-info')));

        const tipo = (datos.Tipo || "").toLowerCase();
        const classType = tipo.includes("franquicia") ? "franquicia" : "propio";
        const cotizacion = obtenerCotizacion(datos, programa);

        let textoBase = [
            `Instituto: ${datos.Nombre || 'N/D'}`,
            `Tipo: ${datos.Tipo || 'Instituto'}`,
            `Categoría: ${classType === "franquicia" ? "Franquicia" : "Propio"}`,
            cotizacion.texto
        ].filter(Boolean).join("\n");

        if (classType === "franquicia") {
            textoBase += `\n\nContacto Franquicia:\nCoordinador: ${datos.NOMBRE2 || "N/D"}\nTeléfono: ${datos.TELÉFONOS || "N/D"}\nEmail: ${datos.EMAIL3 || "N/D"}`;
        }

        copiarAlPortapapeles(textoBase);
    }

    function renderSugerencias(lista) {
        const contenedor = document.getElementById("sugerencias");

        if (!lista.length) {
            contenedor.innerHTML = "";
            contenedor.style.display = "none";
            return;
        }

        contenedor.innerHTML = lista.map(item => `
            <div class="sugerencia-item" data-nombre="${String(item.Nombre || "").replace(/"/g, '&quot;')}">
                ${item.Nombre || "Sin nombre"}
                <span class="sugerencia-sub">${item.Tipo || "Instituto"}${item.Zona ? " • Zona " + item.Zona : ""}</span>
            </div>
        `).join("");

        contenedor.style.display = "block";
    }

    function actualizarSugerencias() {
        const busqueda = normalizarTexto(document.getElementById('textoBusqueda').value);
        const contenedor = document.getElementById("sugerencias");

        if (!busqueda) {
            contenedor.innerHTML = "";
            contenedor.style.display = "none";
            return;
        }

        const sugerencias = todosLosDatos
            .filter(f => f.Nombre && normalizarTexto(f.Nombre).includes(busqueda))
            .sort((a, b) => {
                const na = normalizarTexto(a.Nombre);
                const nb = normalizarTexto(b.Nombre);
                const aEmpieza = na.startsWith(busqueda) ? 0 : 1;
                const bEmpieza = nb.startsWith(busqueda) ? 0 : 1;
                if (aEmpieza !== bEmpieza) return aEmpieza - bEmpieza;
                return na.localeCompare(nb);
            })
            .slice(0, 6);

        renderSugerencias(sugerencias);
    }

    function seleccionarSugerencia(nombre) {
        document.getElementById('textoBusqueda').value = nombre;
        document.getElementById("sugerencias").style.display = "none";
        buscarInstituto();
    }

    function buscarInstituto() {
        const busqueda = normalizarTexto(document.getElementById('textoBusqueda').value.trim());
        document.getElementById("sugerencias").style.display = "none";

        const resultados = todosLosDatos.filter(f => 
            f.Nombre && normalizarTexto(f.Nombre).includes(busqueda)
        );

        let htmlTotal = "";

        resultados.forEach((encontrado, index) => {
            const infoJson = encodeURIComponent(JSON.stringify(encontrado));
            const tipo = (encontrado.Tipo || "").toLowerCase();
            const classType = tipo.includes("franquicia") ? "franchise" : "own";
            
            let franquiciaHtml = "";
            if (classType === "franchise") {
                franquiciaHtml = `
                    <div class="caja-info franchise" style="margin-bottom: 15px; margin-top: 15px;">
                        <span class="info-label" style="margin-bottom: 8px; display:block;"><i class="fas fa-headset"></i> Contacto Franquicia</span>
                        <div class="info-grid">
                            <div class="info-item"><span class="info-label">Coordinador</span><span class="info-value">${encontrado.NOMBRE2 || "N/D"}</span></div>
                            <div class="info-item"><span class="info-label">Teléfono</span><span class="info-value">${encontrado.TELÉFONOS || "N/D"}</span></div>
                            <div class="info-item" style="grid-column: span 2;"><span class="info-label">Email</span><span class="info-value" style="word-break: break-all; font-size: 0.9em;">${encontrado.EMAIL3 || "N/D"}</span></div>
                        </div>
                    </div>
                `;
            }

            let enlaceHtml = "";
            let linkUrl = (encontrado.Wiki || "").toString().trim();
            let tieneWiki = linkUrl !== "" && linkUrl !== "#" && linkUrl.toLowerCase() !== "n/a" && linkUrl.toLowerCase() !== "0";

            if (classType === "franchise") {
                enlaceHtml = "";
            } else {
                if (tieneWiki) {
                    if (!linkUrl.startsWith('http')) linkUrl = 'https://' + linkUrl;
                    enlaceHtml = `<a href="${linkUrl}" target="_blank" class="btn-wiki">Abrir WIKI</a>`;
                } else {
                    enlaceHtml = `<div style="text-align:center; margin-top:20px; padding:12px; background-color:var(--info-box); border-radius:12px; font-weight:bold; color:var(--text); font-size:0.9em; opacity:0.7;">
                        <i class="fas fa-info-circle"></i> Sin wiki disponible
                    </div>`;
                }
            }

            htmlTotal += `
                <div class="result-card">
                    <div class="instituto-header">
                        <div>
                            <span class="instituto-nombre">${encontrado.Nombre}</span><br>
                            <span class="type-badge ${classType}">${encontrado.Tipo || 'Instituto'}</span>
                        </div>
                        <i class="fas fa-school" style="font-size: 1.5em;"></i>
                    </div>

                    ${franquiciaHtml}

                    <label style="font-size:0.7em;">Selecciona Programa:</label>
                    <select id="select-${index}" class="btn-buscar" data-info="${infoJson}" onchange="actualizarCotizacion(${index})">
                        <option value="adults">Adultos (1-20)</option>
                        <option value="pro">Adultos Pro (21-24)</option>
                        <option value="kids">Kids</option>
                        <option value="pteen">Pre-Teens</option>
                        <option value="toefl">TOEFL ITP</option>
                        <option value="tkt">TKT</option>
                        <option value="icc">ICC</option>
                    </select>

                    <div id="precios-${index}"></div>

                    <button class="btn-copiar" onclick="copiarResumen(${index})">
                        <i class="fas fa-copy"></i> Copiar resumen
                    </button>

                    ${enlaceHtml}
                </div>`;
        });

        if (resultados.length > 0) {
            document.getElementById('resultado').innerHTML = htmlTotal;
            resultados.forEach((_, i) => actualizarCotizacion(i));
        } else {
            document.getElementById('resultado').innerHTML = `<p class="empty-state">No se encontró nada para "${document.getElementById('textoBusqueda').value.trim()}".</p>`;
        }
    }

    window.onload = async function() {
        document.getElementById('loadingSpinner').style.display = 'block';

        for (const archivo of archivosA_Cargar) {
            try {
                const response = await fetch(archivo);
                const arrayBuffer = await response.arrayBuffer();
                const libro = XLSX.read(new Uint8Array(arrayBuffer), {type: 'array'});
                const json = XLSX.utils.sheet_to_json(libro.Sheets[libro.SheetNames[0]]);
                todosLosDatos = todosLosDatos.concat(json);
            } catch (e) {
                console.error("Error cargando: " + archivo, e);
                document.getElementById('statusCarga').innerHTML = "❌ Error al cargar algunos datos.";
            }
        }

        document.getElementById('loadingSpinner').style.display = 'none';
        
        if(!document.getElementById('statusCarga').innerHTML.includes("Error")) {
            document.getElementById('statusCarga').innerHTML = "✅ Base de datos lista.";
        }
    };

    document.getElementById('textoBusqueda').addEventListener('input', actualizarSugerencias);

    document.getElementById('textoBusqueda').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            buscarInstituto();
        } else if (e.key === 'Escape') {
            document.getElementById("sugerencias").style.display = "none";
        }
    });

    document.getElementById("sugerencias").addEventListener("click", function(e) {
        const item = e.target.closest(".sugerencia-item");
        if (!item) return;
        seleccionarSugerencia(item.getAttribute("data-nombre"));
    });

    document.addEventListener("click", function(e) {
        const wrap = document.querySelector(".busqueda-wrap");
        const sugerencias = document.getElementById("sugerencias");
        if (!wrap.contains(e.target)) {
            sugerencias.style.display = "none";
        }
    });
</script>
</body>
</html>
