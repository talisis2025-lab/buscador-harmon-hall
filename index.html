<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmon Hall - Buscador Corporativo</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --hh-yellow: #FFEA00;
            --hh-black: #000000;
            --hh-white: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--hh-yellow);
            color: var(--hh-black);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .wave-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, #fff176 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, #fff176 0%, transparent 40%);
        }

        .navbar {
            width: 100%;
            background: var(--hh-black);
            padding: 15px 0;
            display: flex;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .navbar-content {
            width: 90%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-text {
            color: var(--hh-white);
            font-size: 1.5em;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .logo-text span { color: var(--hh-yellow); }

        .main-container {
            width: 90%;
            max-width: 550px;
            margin-top: 40px;
            text-align: center;
        }

        .hero-text {
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease-out;
        }

        .hero-text h1 {
            font-size: 2.2em;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            line-height: 1;
        }

        .hero-text p {
            background: var(--hh-black);
            color: var(--hh-yellow);
            display: inline-block;
            padding: 5px 15px;
            font-weight: bold;
            border-radius: 50px;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .search-box {
            background: var(--hh-white);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 25px;
            border: 2px solid #eee;
            border-radius: 50px;
            font-size: 1.1em;
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box;
            background: #f9f9f9;
        }

        input[type="text"]:focus {
            border-color: var(--hh-black);
            background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .btn-search {
            width: 100%;
            background: var(--hh-black);
            color: var(--hh-yellow);
            border: none;
            padding: 18px;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-search:hover {
            transform: scale(1.02);
            background: #222;
        }

        .status-bar {
            margin-top: 15px;
            font-size: 0.85em;
            font-weight: bold;
            color: #666;
        }

        #resultado {
            margin-top: 30px;
            width: 100%;
            padding-bottom: 80px;
            text-align: left;
        }

        .card {
            background: var(--hh-white);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-left: 8px solid var(--hh-black);
            animation: fadeInUp 0.5s ease-out forwards;
        }

        .card-title {
            font-size: 1.4em;
            font-weight: 900;
            margin: 0;
            color: var(--hh-black);
        }

        .btn-wiki {
            display: block;
            text-align: center;
            background: var(--hh-yellow);
            color: var(--hh-black);
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            margin-top: 20px;
            font-weight: 900;
            font-size: 0.9em;
            border: 2px solid var(--hh-black);
            transition: all 0.3s;
        }

        .btn-wiki:hover {
            background: var(--hh-black);
            color: var(--hh-yellow);
        }

        .sin-wiki {
            display: block;
            margin-top: 15px;
            font-size: 0.85em;
            color: #cc1e3d;
            font-style: italic;
        }

        .footer-nabil {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--hh-black);
            color: var(--hh-white);
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 0.75em;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            pointer-events: none;
        }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="wave-bg"></div>

<div class="navbar">
    <div class="navbar-content">
        <div class="logo-text">HARMON <span>HALL</span></div>
        <div style="color: white; font-size: 0.8em; font-weight: bold;">SALES SUPPORT v3.0</div>
    </div>
</div>

<div class="main-container">
    <div class="hero-text">
        <h1>¡Di Yes al éxito!</h1>
        <p>Buscador Interno</p>
    </div>

    <div class="search-box">
        <div class="input-group">
            <input type="text" id="textoBusqueda" placeholder="Escribe el nombre del instituto...">
        </div>
        <button class="btn-search" onclick="buscarInstituto()">
            <i class="fas fa-search"></i> Buscar Ahora
        </button>
        <div id="statusCarga" class="status-bar">Descargando base de datos en vivo... ⏳</div>
    </div>

    <div id="resultado"></div>
</div>

<div class="footer-nabil">~Powered By Nabil Q</div>

<script>
    let todosLosDatos = [];
    const archivosA_Cargar = ['database.xlsx']; 

    window.onload = async function() {
        let procesados = 0;
        for (const nombreArchivo of archivosA_Cargar) {
            try {
                const response = await fetch(nombreArchivo);
                if (!response.ok) throw new Error("Archivo no encontrado");
                
                const arrayBuffer = await response.arrayBuffer();
                const data = new Uint8Array(arrayBuffer);
                const libro = XLSX.read(data, {type: 'array'});
                const hoja = libro.Sheets[libro.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(hoja);
                
                todosLosDatos = todosLosDatos.concat(json);
                procesados++;
            } catch (error) {
                console.error("Error cargando archivo", error);
            }
        }
        
        if (procesados > 0) {
            document.getElementById('statusCarga').innerHTML = "✔️ ¡Listo! " + todosLosDatos.length + " institutos cargados.";
            document.getElementById('statusCarga').style.color = "black";
        } else {
            document.getElementById('statusCarga').innerHTML = "❌ Error: Base de datos no encontrada.";
            document.getElementById('statusCarga').style.color = "red";
        }
    };

    function buscarInstituto() {
        const busqueda = document.getElementById('textoBusqueda').value.toLowerCase().trim();
        const caja = document.getElementById('resultado');

        if (todosLosDatos.length === 0) {
            caja.innerHTML = `<p style="color:#cc1e3d; text-align:center; font-weight:bold;">Aún estamos conectando la base de datos...</p>`;
            return;
        }

        if (busqueda === "") {
            caja.innerHTML = `<p style="color:#000; text-align:center; font-weight:bold;">Escribe algo para buscar.</p>`;
            return;
        }

        const resultados = todosLosDatos.filter(fila => 
            fila.Nombre && fila.Nombre.toString().toLowerCase().includes(busqueda)
        );

        if (resultados.length > 0) {
            let htmlTotal = `<p style="color: var(--hh-black); font-weight: bold; margin-bottom: 15px; text-align: center;">Se encontraron ${resultados.length} coincidencia(s):</p>`;

            resultados.forEach((encontrado, index) => {
                let linkWiki = null;
                Object.keys(encontrado).forEach(columna => {
                    let nomCol = columna.toLowerCase().trim();
                    if (nomCol.includes("wiki") || nomCol.includes("link") || nomCol.includes("url")) {
                        linkWiki = encontrado[columna];
                    }
                });

                const nombreReal = encontrado.Nombre;
                let htmlResultado = `
                    <div class="card" style="animation-delay: ${index * 0.1}s">
                        <div class="card-title">${nombreReal}</div>
                `;

                if (linkWiki && linkWiki.toString().trim() !== "") {
                    let urlFinal = linkWiki.toString().trim();
                    if (!urlFinal.startsWith('http')) {
                        urlFinal = 'https://' + urlFinal;
                    }
                    htmlResultado += `
                        <a href="${urlFinal}" target="_blank" class="btn-wiki">
                            <i class="fas fa-external-link-alt"></i> ABRIR WIKI INSTITUTO
                        </a>
                    `;
                } else {
                    htmlResultado += `<span class="sin-wiki"><i class="fas fa-exclamation-circle"></i> Sin enlace disponible.</span>`;
                }

                htmlResultado += `</div>`;
                htmlTotal += htmlResultado;
            });

            caja.innerHTML = htmlTotal;
        } else {
            caja.innerHTML = `
                <div style="text-align:center; padding: 20px; background: #fff; border-radius: 20px; color: var(--hh-black); box-shadow: 0 10px 25px rgba(0,0,0,0.08);">
                    No se encontró nada para <strong>"${busqueda}"</strong>.
                </div>
            `;
        }
    }

    document.getElementById('textoBusqueda').addEventListener('keypress', (e) => { 
        if (e.key === 'Enter') buscarInstituto(); 
    });
</script>

</body>
</html>
