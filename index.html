<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harmon Hall - Buscador Institucional</title>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --hh-yellow: #FFEA00;
            --hh-black: #000000;
            --hh-white: #FFFFFF;
            --hh-red: #cc1e3d;
            
            --bg: var(--hh-yellow);
            --card-bg: var(--hh-white);
            --text: var(--hh-black);
            --border: #e8eaed;
            --input-bg: #f9f9f9;
            --input-border: #eee;
            --info-box: #f4f4f4;
            --alert-bg: #ffebee;
            --alert-text: #cc1e3d;
            --franchise-bg: #fff8f8;
            --franchise-border: #ffcdd2;
        }

        [data-theme="dark"] {
            --bg: #111111;
            --card-bg: #222222;
            --text: #ffffff;
            --border: #333333;
            --input-bg: #333333;
            --input-border: #444444;
            --info-box: #2a2a2a;
            --alert-bg: #4a151b;
            --alert-text: #ff8a9f;
            --franchise-bg: #301b1e;
            --franchise-border: #5c262e;
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0;
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            transition: background-color 0.3s; 
            overflow-x: hidden;
        }

        /* Detalle técnico CSS: Fondos radiales adaptativos */
        .wave-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
        }
        [data-theme="light"] .wave-bg {
            background: radial-gradient(circle at 20% 30%, #fff176 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, #fff176 0%, transparent 40%);
        }
        [data-theme="dark"] .wave-bg {
            background: radial-gradient(circle at 20% 30%, #2a2a2a 0%, transparent 40%),
                        radial-gradient(circle at 80% 70%, #2a2a2a 0%, transparent 40%);
        }

        .header { width: 100%; max-width: 600px; display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--text); padding-bottom: 15px; margin-bottom: 30px; }
        .header-title h1 { margin: 0; font-size: 1.8em; font-weight: 900; text-transform: uppercase; letter-spacing: -1px; }
        
        .dark-mode-toggle { cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; }

        .contenedor { width: 100%; max-width: 550px; position: relative; }
        .seccion { margin-bottom: 20px; padding: 25px; border-radius: 20px; background-color: var(--card-bg); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        input[type="text"] { 
            width: 100%; padding: 18px 25px; border: 2px solid var(--input-border); border-radius: 50px; 
            outline: none; background-color: var(--input-bg); color: var(--text); font-size: 1.05em; box-sizing: border-box; 
        }
        
        .btn-buscar { width: 100%; padding: 16px; background: var(--text); color: var(--bg); border: none; border-radius: 50px; cursor: pointer; font-weight: 900; text-transform: uppercase; margin-top: 10px; }

        .result-card { background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border-left: 8px solid var(--text); margin-bottom: 20px; animation: slideUp 0.4s ease-out; }

        .type-badge { padding: 5px 12px; border-radius: 50px; font-size: 0.75em; font-weight: 900; color: #fff; text-transform: uppercase; display: inline-block; }
        .type-badge.own { background: var(--hh-black); }
        .type-badge.franchise { background: var(--hh-red); }

        .caja-info { margin-top: 15px; padding: 15px; border-radius: 12px; background-color: var(--info-box); }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .info-label { color: #888; font-weight: bold; font-size: 0.75em; text-transform: uppercase; }
        .info-value { font-weight: 900; font-size: 1.1em; }

        .btn-copiar {
            width: 100%; margin-top: 15px; padding: 14px; background-color: var(--hh-red); 
            color: white; border: none; border-radius: 12px; font-weight: 900; text-transform: uppercase; cursor: pointer;
        }

        /* Toast Notification */
        .toast-container { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10000; }
        .toast { 
            background: var(--hh-black); color: var(--hh-yellow); padding: 12px 25px; 
            border-radius: 50px; font-weight: 900; font-size: 0.85em; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            display: flex; align-items: center; gap: 10px; animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2.2s forwards;
        }
        [data-theme="dark"] .toast { background: var(--hh-yellow); color: var(--hh-black); }

        @keyframes toastIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes toastOut { to { opacity: 0; visibility: hidden; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body data-theme="light">

<div class="wave-bg"></div>

<div class="header">
    <div class="header-title"><h1>Harmon <span>Hall</span></h1></div>
    <div class="dark-mode-toggle" onclick="toggleDarkMode()">
        <i id="darkModeIcon" class="fas fa-moon"></i> <span id="modeText">Noche</span>
    </div>
</div>

<div class="contenedor">
    <div class="seccion" style="text-align: center;">
        <span id="statusCarga">Cargando seguridad...</span>
    </div>

    <div class="seccion">
        <input type="text" id="textoBusqueda" placeholder="Buscar instituto..." onfocus="this.select()">
        <button class="btn-buscar" onclick="buscarInstituto()">Buscar</button>
    </div>

    <div id="resultado"></div>
</div>

<script>
    // --- 1. SEGURIDAD: VALIDACIÓN DE DOMINIO ---
    const dominiosAutorizados = ['unid.mx', 'talisis.com', 'harmonhall.edu.mx'];

    function verificarAcceso() {
        if (sessionStorage.getItem('acceso_valido') === 'true') return true;

        const correo = prompt("🔐 ACCESO RESTRINGIDO\n\nIngresa tu correo institucional (@unid.mx / @talisis.com):");
        
        if (!correo) {
            document.body.innerHTML = "<h1 style='text-align:center; margin-top:100px;'>Acceso cancelado.</h1>";
            return false;
        }

        const dominio = correo.toLowerCase().split('@')[1];

        if (dominiosAutorizados.includes(dominio)) {
            sessionStorage.setItem('acceso_valido', 'true');
            return true;
        } else {
            alert("Acceso denegado. El dominio @" + dominio + " no está autorizado.");
            document.body.innerHTML = "<h1 style='text-align:center; color:red; margin-top:100px;'>🚫 NO AUTORIZADO</h1>";
            return false;
        }
    }

    // Ejecutar validación antes de cargar nada
    if (!verificarAcceso()) {
        throw new Error("Parada de seguridad: Usuario no autorizado.");
    }

    // --- 2. LÓGICA DEL BUSCADOR ---
    let todosLosDatos = [];
    const archivos = ['database.xlsx', 'database2.xlsx'];

    function mostrarNotificacion(msg) {
        let container = document.querySelector('.toast-container') || document.createElement('div');
        container.className = 'toast-container';
        document.body.appendChild(container);

        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
    }

    async function copiarAlPortapapeles(texto) {
        try {
            await navigator.clipboard.writeText(texto);
            mostrarNotificacion("COPIADO AL PORTAPAPELLES");
        } catch (err) {
            mostrarNotificacion("ERROR AL COPIAR");
        }
    }

    function toggleDarkMode() {
        const body = document.body;
        const isLight = body.getAttribute('data-theme') === 'light';
        body.setAttribute('data-theme', isLight ? 'dark' : 'light');
        document.getElementById('darkModeIcon').className = isLight ? 'fas fa-sun' : 'fas fa-moon';
        document.getElementById('modeText').innerText = isLight ? 'Día' : 'Noche';
    }

    // (Aquí irían tus funciones de búsqueda, normalizarTexto y renderizado de antes)
    // He omitido la repetición de lógica de Excel para brevedad, pero asegúrate de 
    // usar las funciones de "copiarAlPortapapeles" y "mostrarNotificacion" 
    // dentro de tu botón de copiar.

    window.onload = async function() {
        document.getElementById('statusCarga').innerText = "Cargando bases de datos... ⏳";
        // Lógica de carga de archivos Excel aquí...
        document.getElementById('statusCarga').innerText = "✅ Sistema Seguro y Listo";
    }

    function buscarInstituto() {

</script>
</body>
</html>
